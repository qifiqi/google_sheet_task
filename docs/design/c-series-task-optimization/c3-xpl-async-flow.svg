<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .lane { fill: #ffffff; stroke: #d7dce5; stroke-width: 1.5; }
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .lane-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #344054; }
      .box { rx: 12; ry: 12; stroke-width: 2; }
      .task { fill: #e8f3ff; stroke: #4a90e2; }
      .db { fill: #ecfdf3; stroke: #22a06b; }
      .worker { fill: #fff5e6; stroke: #f59e0b; }
      .summary { fill: #f4f0ff; stroke: #7c3aed; }
      .text { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475467; }
      .arrow { stroke: #667085; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="760"/>
  <text class="title" x="48" y="56">C3 收益序列与 XPL 异步分析流程</text>
  <text class="small" x="48" y="84">主任务线程只负责驱动 Google Sheet 和保存快照；XPL CPU 计算交给独立 worker 进程处理。</text>

  <rect class="lane" x="40" y="120" width="310" height="560" rx="16"/>
  <rect class="lane" x="390" y="120" width="310" height="560" rx="16"/>
  <rect class="lane" x="740" y="120" width="310" height="560" rx="16"/>
  <rect class="lane" x="1090" y="120" width="310" height="560" rx="16"/>

  <text class="lane-title" x="72" y="158">C3 任务线程</text>
  <text class="lane-title" x="422" y="158">数据库持久化</text>
  <text class="lane-title" x="772" y="158">XPL Worker 进程</text>
  <text class="lane-title" x="1122" y="158">查询 / 汇总</text>

  <rect class="box task" x="72" y="195" width="246" height="66"/>
  <text class="text" x="96" y="222">写入参数到 Sheet</text>
  <text class="small" x="96" y="244">B6/B7/B9/B10/B11/B12</text>

  <rect class="box task" x="72" y="300" width="246" height="66"/>
  <text class="text" x="96" y="327">固定等待和检查位校验</text>
  <text class="small" x="96" y="349">I6/I7/I9/I10/I11/I12</text>

  <rect class="box task" x="72" y="405" width="246" height="66"/>
  <text class="text" x="96" y="432">读取基础结果</text>
  <text class="small" x="96" y="454">I15 到 I23</text>

  <rect class="box task" x="72" y="510" width="246" height="66"/>
  <text class="text" x="96" y="537">读取收益序列快照</text>
  <text class="small" x="96" y="559">日期列缓存，只重读 K/O</text>

  <rect class="box db" x="422" y="220" width="246" height="66"/>
  <text class="text" x="446" y="247">保存 TaskResult</text>
  <text class="small" x="446" y="269">基础结果 + analysis_status</text>

  <rect class="box db" x="422" y="345" width="246" height="66"/>
  <text class="text" x="446" y="372">保存 TaskResultReturn</text>
  <text class="small" x="446" y="394">returns_json 收益序列</text>

  <rect class="box db" x="422" y="470" width="246" height="66"/>
  <text class="text" x="446" y="497">创建 XplAnalysisJob</text>
  <text class="small" x="446" y="519">pending，task_result 唯一</text>

  <rect class="box worker" x="772" y="220" width="246" height="66"/>
  <text class="text" x="796" y="247">领取 pending job</text>
  <text class="small" x="796" y="269">事务锁定，防重复领取</text>

  <rect class="box worker" x="772" y="345" width="246" height="66"/>
  <text class="text" x="796" y="372">ProcessPool 执行 XPL</text>
  <text class="small" x="796" y="394">CPU/Pandas 计算</text>

  <rect class="box worker" x="772" y="470" width="246" height="66"/>
  <text class="text" x="796" y="497">回写分析结果</text>
  <text class="small" x="796" y="519">flat_result / analyze_result</text>

  <rect class="box summary" x="1122" y="260" width="246" height="66"/>
  <text class="text" x="1146" y="287">详情页 / 导出</text>
  <text class="small" x="1146" y="309">识别分析中 / 完成 / 失败</text>

  <rect class="box summary" x="1122" y="425" width="246" height="66"/>
  <text class="text" x="1146" y="452">汇总索引刷新</text>
  <text class="small" x="1146" y="474">job 完成后增量或最终补刷</text>

  <path class="arrow" d="M195 261 L195 300"/>
  <path class="arrow" d="M195 366 L195 405"/>
  <path class="arrow" d="M195 471 L195 510"/>
  <path class="arrow" d="M318 543 C365 543 375 253 422 253"/>
  <path class="arrow" d="M318 543 C366 543 374 378 422 378"/>
  <path class="arrow" d="M668 378 C710 378 730 503 772 503"/>
  <path class="arrow" d="M668 503 C710 503 730 253 772 253"/>
  <path class="arrow" d="M895 286 L895 345"/>
  <path class="arrow" d="M895 411 L895 470"/>
  <path class="arrow" d="M1018 503 C1062 503 1078 293 1122 293"/>
  <path class="arrow" d="M1018 503 C1062 503 1078 458 1122 458"/>
  <path class="arrow dash" d="M195 576 C195 630 546 630 546 536"/>
  <text class="small" x="235" y="624">主任务线程创建 job 后进入下一组参数</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">V1 数据源方案三，粘贴优先导入辅助</title><desc id="desc">通过按钮切换 Google Sheet 与手动数据；在手动数据模式中粘贴区域始终可见，Excel 导入是就近操作。</desc>
  <defs><filter id="s" x="-8%" y="-12%" width="116%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#172033" flood-opacity=".08"/></filter><style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#212529}.b{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#495057}.m{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6c757d}.code{font-family:Consolas,'Microsoft YaHei',monospace;fill:#526477}</style></defs>
  <rect width="1440" height="820" fill="#f8f9fa"/><text x="38" y="71" class="t" font-size="28" font-weight="600">V1：回测数据分析</text><rect x="1301" y="45" width="102" height="34" rx="5" fill="#fff" stroke="#6c757d"/><text x="1327" y="67" class="b" font-size="14">← 返回</text><line x1="38" y1="106" x2="1402" y2="106" stroke="#dee2e6"/>
  <rect x="38" y="126" width="1364" height="492" rx="7" fill="#fff" filter="url(#s)"/><text x="62" y="164" class="t" font-size="17" font-weight="600">数据输入</text><text x="62" y="190" class="m" font-size="13">直接编辑数据；导入 Excel 后也会先回填至下方，便于确认</text>
  <rect x="62" y="213" width="251" height="39" rx="5" fill="#e9ecef"/><text x="89" y="238" class="b" font-size="14">Google Sheet</text><rect x="185" y="215" width="126" height="35" rx="4" fill="#0d6efd"/><text x="216" y="238" fill="#fff" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600">手动数据</text>
  <line x1="62" y1="277" x2="1378" y2="277" stroke="#e9ecef"/><text x="62" y="316" class="t" font-size="16" font-weight="600">回测收益数据</text><text x="62" y="341" class="m" font-size="13">可直接粘贴，也可以选择本地 Excel 后自动导入</text>
  <rect x="1040" y="300" width="174" height="38" rx="5" fill="#fff" stroke="#0d6efd"/><text x="1066" y="325" fill="#0d6efd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13">从 Excel 导入</text><rect x="1224" y="300" width="78" height="38" rx="5" fill="#fff" stroke="#6c757d"/><text x="1246" y="325" class="b" font-size="13">示例</text><rect x="1312" y="300" width="66" height="38" rx="5" fill="#fff" stroke="#dc3545"/><text x="1331" y="325" fill="#dc3545" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13">清空</text>
  <rect x="62" y="365" width="996" height="201" rx="5" fill="#fff" stroke="#adb5bd"/><text x="82" y="397" class="code" font-size="13" font-weight="700">date              index_return     start_return</text><text x="82" y="429" class="code" font-size="13">2025-01-02        0.0123           0.0156</text><text x="82" y="457" class="code" font-size="13">2025-01-03        -0.0081          -0.0042</text><text x="82" y="485" class="code" font-size="13">2025-01-06        0.0069           0.0104</text><text x="82" y="535" class="m" font-size="12">支持 Tab、逗号或空格分隔。首行含 date / index_return / start_return 时视为列头。</text>
  <rect x="1086" y="365" width="292" height="201" rx="5" fill="#f8f9fa" stroke="#dee2e6"/><text x="1110" y="402" class="t" font-size="15" font-weight="600">Excel 导入设置</text><line x1="1110" y1="418" x2="1354" y2="418" stroke="#dee2e6"/><text x="1110" y="452" class="b" font-size="13">读取范围</text><text x="1110" y="476" class="m" font-size="12">第 1 个工作表 · 前三列</text><text x="1110" y="510" class="b" font-size="13">列头处理</text><text x="1110" y="534" class="m" font-size="12">自动识别并跳过</text>
  <text x="62" y="594" class="m" font-size="13">已识别 3 列，756 行有效数据</text><rect x="1200" y="574" width="178" height="44" rx="5" fill="#0d6efd"/><text x="1246" y="602" fill="#fff" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">⚡ 分析</text>
  <rect x="38" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#0d6efd"/><text x="145" y="682" class="b" font-size="15">跑赢年份</text><text x="197" y="723" class="t" font-size="29" font-weight="600">-</text><text x="121" y="750" class="m" font-size="12">outperform_year</text><rect x="386" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#198754"/><text x="485" y="682" class="b" font-size="15">月超额波动率</text><text x="545" y="723" class="t" font-size="29" font-weight="600">-</text><text x="459" y="750" class="m" font-size="12">monthly_excess_volatility</text><rect x="734" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#ffc107"/><text x="831" y="682" class="b" font-size="15">超额回撤胜率</text><text x="893" y="723" class="t" font-size="29" font-weight="600">-</text><text x="815" y="750" class="m" font-size="12">excess_drawdown_winning_rate</text><rect x="1082" y="642" width="320" height="126" rx="6" fill="#fff" stroke="#dc3545"/><text x="1166" y="682" class="b" font-size="15">年超额收益(整体)</text><text x="1240" y="723" class="t" font-size="29" font-weight="600">-</text><text x="1175" y="750" class="m" font-size="12">excess_returns[all]</text>
</svg>

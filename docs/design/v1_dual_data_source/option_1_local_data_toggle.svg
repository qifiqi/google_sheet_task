<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">V1 数据源方案一，本地数据二级切换</title><desc id="desc">Google Sheet 与本地数据一级切换；本地数据中可选择粘贴或导入 Excel。</desc>
  <defs><filter id="s" x="-8%" y="-12%" width="116%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#172033" flood-opacity=".08"/></filter><style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#212529}.b{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#495057}.m{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6c757d}.code{font-family:Consolas,'Microsoft YaHei',monospace;fill:#526477}</style></defs>
  <rect width="1440" height="820" fill="#f8f9fa"/><rect x="36" y="31" width="1368" height="64" fill="#f8f9fa"/><text x="38" y="71" class="t" font-size="28" font-weight="600">V1：回测数据分析</text><rect x="1301" y="45" width="102" height="34" rx="5" fill="#fff" stroke="#6c757d"/><text x="1327" y="67" class="b" font-size="14">← 返回</text><line x1="38" y1="106" x2="1402" y2="106" stroke="#dee2e6"/>
  <rect x="38" y="126" width="1364" height="492" rx="7" fill="#fff" filter="url(#s)"/><text x="62" y="164" class="t" font-size="17" font-weight="600">数据输入</text><text x="62" y="190" class="m" font-size="13">选择一个数据来源后再开始分析</text>
  <rect x="62" y="212" width="300" height="42" rx="5" fill="#e9ecef"/><rect x="64" y="214" width="146" height="38" rx="4" fill="#fff" stroke="#0d6efd"/><text x="89" y="239" fill="#0d6efd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600">Google Sheet</text><rect x="211" y="214" width="149" height="38" rx="4" fill="#0d6efd"/><text x="257" y="239" fill="#fff" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600">本地数据</text>
  <line x1="62" y1="278" x2="1378" y2="278" stroke="#e9ecef"/>
  <text x="62" y="316" class="t" font-size="16" font-weight="600">本地数据</text><text x="62" y="341" class="m" font-size="13">可从 Excel 复制粘贴，或直接导入本地 Excel 文件</text>
  <rect x="62" y="365" width="240" height="39" rx="5" fill="#e9ecef"/><rect x="64" y="367" width="113" height="35" rx="4" fill="#fff" stroke="#0d6efd"/><text x="91" y="390" fill="#0d6efd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600">粘贴输入</text><text x="204" y="390" class="b" font-size="13">导入 Excel</text>
  <rect x="62" y="424" width="848" height="145" rx="5" fill="#fff" stroke="#adb5bd"/><text x="80" y="454" class="m" font-size="13">将 Excel 中的三列数据粘贴到这里（Tab、逗号或空格分隔）</text><text x="80" y="486" class="code" font-size="13">date              index_return     start_return</text><text x="80" y="512" class="code" font-size="13">2025-01-02        0.0123           0.0156</text><text x="80" y="538" class="code" font-size="13">2025-01-03        -0.0081          -0.0042</text><text x="824" y="590" class="m" font-size="13">0 行数据</text>
  <rect x="938" y="365" width="440" height="204" rx="6" fill="#f8f9fa" stroke="#dee2e6"/><text x="962" y="402" class="t" font-size="15" font-weight="600">直接导入 Excel</text><text x="962" y="428" class="m" font-size="13">.xlsx / .xls · 文件仅在浏览器中读取</text><rect x="962" y="453" width="184" height="42" rx="5" fill="#fff" stroke="#0d6efd"/><text x="989" y="480" fill="#0d6efd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14">选择 Excel 文件</text><text x="962" y="529" class="b" font-size="13">默认读取：第 1 个工作表 · A:C 三列</text><text x="962" y="553" class="m" font-size="12">首行识别为列头时自动跳过，并回填到左侧输入框</text>
  <rect x="1200" y="590" width="178" height="44" rx="5" fill="#0d6efd"/><text x="1246" y="618" fill="#fff" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">⚡ 分析</text>
  <rect x="38" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#0d6efd"/><text x="145" y="682" class="b" font-size="15">跑赢年份</text><text x="197" y="723" class="t" font-size="29" font-weight="600">-</text><text x="121" y="750" class="m" font-size="12">outperform_year</text><rect x="386" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#198754"/><text x="485" y="682" class="b" font-size="15">月超额波动率</text><text x="545" y="723" class="t" font-size="29" font-weight="600">-</text><text x="459" y="750" class="m" font-size="12">monthly_excess_volatility</text><rect x="734" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#ffc107"/><text x="831" y="682" class="b" font-size="15">超额回撤胜率</text><text x="893" y="723" class="t" font-size="29" font-weight="600">-</text><text x="815" y="750" class="m" font-size="12">excess_drawdown_winning_rate</text><rect x="1082" y="642" width="320" height="126" rx="6" fill="#fff" stroke="#dc3545"/><text x="1166" y="682" class="b" font-size="15">年超额收益(整体)</text><text x="1240" y="723" class="t" font-size="29" font-weight="600">-</text><text x="1175" y="750" class="m" font-size="12">excess_returns[all]</text>
</svg>

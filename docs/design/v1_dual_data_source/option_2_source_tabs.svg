<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">V1 数据源方案二，来源标签页</title><desc id="desc">以三个标签页分别区分 Google Sheet、粘贴数据和导入 Excel；示例展示导入 Excel 标签。</desc>
  <defs><filter id="s" x="-8%" y="-12%" width="116%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#172033" flood-opacity=".08"/></filter><style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#212529}.b{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#495057}.m{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6c757d}.code{font-family:Consolas,'Microsoft YaHei',monospace;fill:#526477}</style></defs>
  <rect width="1440" height="820" fill="#f8f9fa"/><text x="38" y="71" class="t" font-size="28" font-weight="600">V1：回测数据分析</text><rect x="1301" y="45" width="102" height="34" rx="5" fill="#fff" stroke="#6c757d"/><text x="1327" y="67" class="b" font-size="14">← 返回</text><line x1="38" y1="106" x2="1402" y2="106" stroke="#dee2e6"/>
  <rect x="38" y="126" width="1364" height="492" rx="7" fill="#fff" filter="url(#s)"/><text x="62" y="164" class="t" font-size="17" font-weight="600">数据输入</text><text x="62" y="190" class="m" font-size="13">不同来源独立配置，分析参数和结果保持一致</text>
  <line x1="62" y1="240" x2="1378" y2="240" stroke="#dee2e6"/><text x="74" y="226" class="b" font-size="14">Google Sheet</text><text x="200" y="226" class="b" font-size="14">粘贴数据</text><text x="306" y="226" fill="#0d6efd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600">导入 Excel</text><line x1="290" y1="240" x2="386" y2="240" stroke="#0d6efd" stroke-width="2"/>
  <text x="62" y="284" class="t" font-size="16" font-weight="600">从本地 Excel 导入</text><text x="62" y="310" class="m" font-size="13">上传后立即由浏览器解析，不会上传原始 Excel 文件</text>
  <rect x="62" y="338" width="730" height="204" rx="5" fill="#fff" stroke="#adb5bd" stroke-dasharray="5 4"/><path d="M412 384 h30 v38 h-30 z M419 377 h16 v10 M419 403 h16 M419 414 h16" fill="none" stroke="#0d6efd" stroke-width="1.8" stroke-linejoin="round"/><text x="368" y="454" class="b" font-size="15">拖放 Excel 文件到这里，或</text><rect x="556" y="426" width="120" height="38" rx="5" fill="#fff" stroke="#0d6efd"/><text x="584" y="451" fill="#0d6efd" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14">选择文件</text><text x="333" y="493" class="m" font-size="12">支持 .xlsx、.xls；读取第一个工作表的前三列</text>
  <rect x="822" y="338" width="556" height="204" rx="5" fill="#f8f9fa" stroke="#dee2e6"/><text x="848" y="376" class="t" font-size="15" font-weight="600">导入规则</text><line x1="848" y1="392" x2="1352" y2="392" stroke="#dee2e6"/><text x="848" y="425" class="b" font-size="13">工作表</text><text x="968" y="425" class="m" font-size="13">默认第 1 个工作表</text><text x="848" y="457" class="b" font-size="13">数据范围</text><text x="968" y="457" class="m" font-size="13">仅读取前三列（A:C）</text><text x="848" y="489" class="b" font-size="13">首行处理</text><text x="968" y="489" class="m" font-size="13">识别为列头则自动跳过</text><text x="848" y="521" class="b" font-size="13">标准字段</text><text x="968" y="521" class="code" font-size="12">date / index_return / start_return</text>
  <rect x="62" y="567" width="1004" height="25" fill="#edf7ee"/><text x="78" y="585" fill="#198754" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="12">导入完成后会自动切换至“粘贴数据”页，可先预览和调整内容再分析。</text><rect x="1200" y="559" width="178" height="44" rx="5" fill="#0d6efd"/><text x="1246" y="587" fill="#fff" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">⚡ 分析</text>
  <rect x="38" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#0d6efd"/><text x="145" y="682" class="b" font-size="15">跑赢年份</text><text x="197" y="723" class="t" font-size="29" font-weight="600">-</text><text x="121" y="750" class="m" font-size="12">outperform_year</text><rect x="386" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#198754"/><text x="485" y="682" class="b" font-size="15">月超额波动率</text><text x="545" y="723" class="t" font-size="29" font-weight="600">-</text><text x="459" y="750" class="m" font-size="12">monthly_excess_volatility</text><rect x="734" y="642" width="329" height="126" rx="6" fill="#fff" stroke="#ffc107"/><text x="831" y="682" class="b" font-size="15">超额回撤胜率</text><text x="893" y="723" class="t" font-size="29" font-weight="600">-</text><text x="815" y="750" class="m" font-size="12">excess_drawdown_winning_rate</text><rect x="1082" y="642" width="320" height="126" rx="6" fill="#fff" stroke="#dc3545"/><text x="1166" y="682" class="b" font-size="15">年超额收益(整体)</text><text x="1240" y="723" class="t" font-size="29" font-weight="600">-</text><text x="1175" y="750" class="m" font-size="12">excess_returns[all]</text>
</svg>

# 前端入口配置（部署模式 A：nginx 直发静态资源 + 反代 /api）
# 依据 docs/design/frontend-refactor/05-deployment.md §3；API 前缀以 2026-09-28
# URL 命名收敛后的路由表为准（全部 JSON API 均在 /api 下，页面路由不含 API 子路径）。
# 说明：当前无 TLS 证书，走 HTTP；将来启用 HTTPS 时把 listen 80 改为
# listen 443 ssl http2 并挂载证书，即可获得 HTTP/2 多路复用。

worker_processes auto;

# 容器原生日志输出（json-file 驱动收集）；pid 放 /tmp 以兼容非 root 运行
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Sheet/令牌导入等上传接口的余量
    client_max_body_size 50m;

    # HTML 默认协商缓存（每次回源校验，304 极小，发布即生效）；
    # /static/ 在 location 内覆盖为 7 天强缓存。
    expires -1;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 容器内 DNS：app 容器重启换 IP 后 10 秒内自动跟随（配合变量形式的 proxy_pass）
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        root /opt/app/templates;

        set $flask_upstream http://app:5000;

        # ---- 动态 API：唯一 API 根是 /api（含 /api/backtest-training、
        # /api/backtest-multi-product、/api/global-preview 等全部子域）----
        # ^~ 命中后跳过正则匹配，下方页面正则不会拦截任何接口。
        location ^~ /api/ {
            proxy_pass $flask_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;   # 导出/全局预览类接口耗时较长
        }

        # ---- 页面旧前缀（legacy_bp 仍保留页面路由与登录重定向，交还 Flask）----
        location /backtest {
            proxy_pass $flask_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- 静态资源：直发 + 7 天强缓存（gzip 后文本约压缩到 1/6）----
        location /static/ {
            alias /opt/app/static/;
            expires 7d;
        }

        # ---- 精确入口 ----
        location = / { try_files /google_sheet/index.html =404; }
        location = /login { try_files /login.html =404; }
        location = /admin { return 301 /admin/; }
        location = /admin/ { try_files /admin/dashboard.html =404; }
        location = /eastmoney-kline { try_files /eastmoney_kline/index.html =404; }
        location = /global-preview { try_files /global_preview/index.html =404; }
        location = /global-preview/single-product { try_files /global_preview/index.html =404; }
        location = /performance-analysis { try_files /performance_analysis/index.html =404; }
        location = /performance-analysis/ { try_files /performance_analysis/index.html =404; }
        location = /performance-analysis/v2 { try_files /performance_analysis/v2.html =404; }
        location = /performance-analysis/weight-combination { try_files /performance_analysis/weight_combination.html =404; }

        # URL 连字符 → 模板文件名下划线的 admin 页面
        location = /admin/model-summary { try_files /admin/model_summary.html =404; }
        location = /admin/eastmoney-kline { try_files /admin/eastmoney_kline.html =404; }
        location = /admin/google-sheets { try_files /admin/google_sheets.html =404; }

        # ---- google_sheet 版本分发（与 Flask 内 dispatcher 逐分支等价）----
        location = /google-sheet { try_files /google_sheet/index.html =404; }
        location = /google-sheet/ { try_files /google_sheet/index.html =404; }
        location = /google-sheet/merge-export { try_files /google_sheet/merge_export.html =404; }

        location = /google-sheet/create {
            if ($arg_restart_task_id != "") { rewrite ^ /google_sheet/create_dispatcher.html last; }
            if ($arg_version = "c31") { rewrite ^ /google_sheet_c31/create.html last; }
            if ($arg_version = "c5")  { rewrite ^ /google_sheet_c5/create.html last; }
            if ($arg_version = "c7")  { rewrite ^ /google_sheet_c7/create.html last; }
            if ($arg_version = "c4")  { rewrite ^ /google_sheet_c4/create.html last; }
            rewrite ^ /google_sheet/create.html last;            # 默认 C3
        }

        location = /google-sheet/detail {
            if ($arg_version = "c5") { rewrite ^ /google_sheet_c5/detail.html last; }
            if ($arg_version = "c7") { rewrite ^ /google_sheet_c7/detail.html last; }
            if ($arg_version = "c4") { rewrite ^ /google_sheet_c4/detail.html last; }
            rewrite ^ /google_sheet/detail_dispatcher.html last; # 无 version → dispatcher
        }

        # ---- 页面前缀连字符、模板目录下划线的两个回测域（含路径参数页）----
        location ~ ^/backtest-training/(create|list)$ { try_files /backtest_training/$1.html =404; }
        location ~ ^/backtest-training/detail/ { try_files /backtest_training/detail.html =404; }
        location ~ ^/backtest-training/global-preview/ { try_files /backtest_training/global_preview.html =404; }
        location ~ ^/backtest-training/result/\d+/export-preview { try_files /backtest_training/result_export_preview.html =404; }
        location ~ ^/backtest-training/result/ { try_files /backtest_training/result.html =404; }

        location ~ ^/backtest-multi-product/(create|list)$ { try_files /backtest_multi_product/$1.html =404; }
        location ~ ^/backtest-multi-product/detail/ { try_files /backtest_multi_product/detail.html =404; }
        location ~ ^/backtest-multi-product/global-preview/ { try_files /backtest_multi_product/global_preview.html =404; }
        location ~ ^/backtest-multi-product/result/ { try_files /backtest_multi_product/result.html =404; }

        # ---- 其余无扩展名 URL → 同名 .html（admin 常规页等）----
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  报告字体映射：Word 报告模板字体名为微软雅黑（Microsoft YaHei），
  容器内以仓库自带 Noto Sans SC（OFL 许可）替代。显式映射（含中文名）
  保证字体替换确定，不依赖 fontconfig 的通用回退顺序。
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans SC</string></edit>
  </match>
</fontconfig>

  # 线上数据库：数据落在宿主机 /opt/google_task/pgdata
  # 镜像版本须与 dump 来源对齐：自定义格式 1.16 由 PG17 的 pg_dump 产出，PG16 的 pg_restore 读不了
#  postgres:
#    image: postgres:17
#    restart: unless-stopped
#    shm_size: 256mb
#    ports:
#      # 仅绑定本机回环，供服务器本地 psql/备份使用；不对外网开放
#      - "127.0.0.1:5432:5432"
#    environment:
#      POSTGRES_USER: google_task
#      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 dockers/.env 设置 POSTGRES_PASSWORD}"
#      POSTGRES_DB: googlesheet_validator
#    volumes:
#      - /opt/google_task/pgdata:/var/lib/postgresql/data
#      # dump 导入/备份导出的中转目录：宿主机放文件，容器内路径 /backup 直接可见
#      - /opt/google_task/backup:/backup

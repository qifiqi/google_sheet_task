name: google-sheet-validator

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: google_task:1.0.7
    restart: unless-stopped
    init: true
    # nginx 暂时停用：app 直接对外 8081。
    # 将来启用 nginx 时：改回 expose "5000" + 回环调试口 "127.0.0.1:8082:5000"，
    # 并整体放开下方 nginx 服务块，把 8081 让给 nginx。
    ports:
      - "8081:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      APP_ENV: production
      FLASK_DEBUG: "false"
      MPLCONFIGDIR: /tmp/matplotlib
      HOME: /tmp
    env_file:
      - .env.production
      - .env
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
#    depends_on:
#      postgres:
#        condition: service_healthy

  # 前端入口（部署模式 A，docs/design/frontend-refactor/05-deployment.md §3）：
  # /static/** 与页面 HTML 直发（gzip + 强缓存），/api/** 反代 app。
  # 镜像由 dockers/Dockerfile.nginx 构建，模板/静态资源烧进镜像，与 google_task 同版本号发布。
  # 【暂时停用 2026-09-29】启用步骤：① 放开本块；② app 收回 expose "5000" +
  #    回环调试口，把 8081 让出；③ 构建 google_nginx 镜像（见 dockers/构建.md §5）。

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局预览页</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <link href="/static/css/pages/backtest_training_global_preview.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="container-fluid py-4">
    <div class="preview-layout">
        <div class="header-toolbar">
            <div class="header-toolbar-left">
                <div class="text-body-secondary small">单品数据回测</div>
                <div class="fw-bold" id="taskTitleText">加载中...</div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-success rounded-pill px-3 btn-sm" id="exportGlobalPreviewBtn">
                    <i class="bi bi-file-earmark-excel me-1"></i>导出 XLSX
                </button>
                <a href="/backtest-training/detail/" class="btn btn-outline-secondary rounded-pill px-3 btn-sm" id="backToDetailLink">
                    <i class="bi bi-arrow-left me-1"></i>返回详情
                </a>
            </div>
        </div>

        <details class="summary-panel shadow-sm">
            <summary class="summary-toggle">
                <span class="fw-semibold">任务概要</span>
                <span class="text-body-secondary small">点击展开 4 项信息 <i class="bi bi-chevron-down ms-1 summary-toggle-icon"></i></span>
            </summary>
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-card-label">任务 ID</div>
                    <div class="summary-card-value" id="summaryTaskId"></div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-label">结果总数</div>
                    <div class="summary-card-value" id="summaryTotal">-</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-label">成功结果</div>
                    <div class="summary-card-value text-success" id="summarySuccess">-</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-label">年份分组</div>
                    <div class="summary-card-value" id="summaryGroups">-</div>
                </div>
            </div>
        </details>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="groupSelect" class="form-label text-body-secondary small">年份分组</label>
                        <select class="form-select" id="groupSelect"></select>
                    </div>
                    <div class="col-md-8">
                        <div class="group-meta" id="groupMeta"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="preview-table-wrap" id="previewContainer">
                    <div class="empty-state">正在加载全局预览数据...</div>
                </div>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/backtest_training_global_preview.js"></script>
</body>
</html>

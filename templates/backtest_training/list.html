<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据回测</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>

    <style>
        :root {
            --bs-secondary-color: rgba(33, 37, 41, 0.75);
            --bs-tertiary-bg: #f8f9fa;
            --bs-emphasis-color: #000;
        }
        html[data-bs-theme="dark"] {
            --bs-body-color: #e5e7eb;
            --bs-body-bg: #111827;
            --bs-border-color: #334155;
            --bs-secondary-color: #94a3b8;
            --bs-tertiary-bg: #1f2937;
            --bs-emphasis-color: #f8fafc;
        }
        .text-body {
            color: var(--bs-body-color) !important;
        }
        .text-body-secondary {
            color: var(--bs-secondary-color) !important;
        }
        .bg-body {
            background-color: var(--bs-body-bg) !important;
        }
        .bg-body-tertiary {
            background-color: var(--bs-tertiary-bg) !important;
        }
        body {
            background-color: #f8f9fa;
        }
        html[data-bs-theme="dark"] body {
            background-color: #111827;
            color: #e5e7eb;
        }
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            overflow-y: scroll;
            overflow-x: hidden;
            border-right: 1px solid #e9ecef;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.04);
            scrollbar-gutter: stable;
            flex: 0 0 auto;
        }
        html[data-bs-theme="dark"] .sidebar {
            background: #111827;
            border-right-color: #243041;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.04);
        }
        .sidebar-brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, #0d6efd 0%, #4dabf7 100%);
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.18);
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #495057;
            padding: 0.65rem 0.85rem;
            border-radius: 0.75rem;
            margin-bottom: 0.2rem;
            font-weight: 500;
            transition: all 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link {
            color: #d1d5db;
        }
        .sidebar .nav-link:hover {
            color: #0d6efd;
            background-color: #f1f5ff;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link:hover {
            color: #93c5fd;
            background-color: rgba(59, 130, 246, 0.14);
        }
        .sidebar .nav-link.active {
            color: #0d6efd;
            background-color: #e7f1ff;
            box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.12);
        }
        html[data-bs-theme="dark"] .sidebar .nav-link.active {
            color: #bfdbfe;
            background-color: rgba(59, 130, 246, 0.18);
            box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.2);
        }
        .sidebar .btn-toggle {
            width: 100%;
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #343a40;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.8rem 0.85rem 0.55rem;
            border-radius: 0.75rem;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle {
            color: #e5e7eb;
        }
        .sidebar .btn-toggle:hover {
            background: #f8f9fa;
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #93c5fd;
        }
        .sidebar .btn-toggle-icon {
            transition: transform 0.2s ease;
            color: #868e96;
            font-size: 0.9rem;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle-icon {
            color: #94a3b8;
        }
        .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            transform: rotate(90deg);
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            color: #93c5fd;
        }
        .sidebar .btn-toggle-nav {
            padding-left: 0;
            margin: 0.1rem 0 0;
            list-style: none;
            padding-left: 0.15rem;
        }
        .sidebar .btn-toggle-nav li {
            margin: 0;
        }
        .sidebar .btn-toggle-nav .nav-link {
            margin-left: 0.25rem;
            padding: 0.48rem 0.75rem 0.48rem 0.85rem;
            white-space: nowrap;
            font-size: 0.93rem;
            font-weight: 500;
            border-radius: 0.7rem;
        }
        .sidebar .btn-toggle-nav .nav-link i {
            font-size: 0.92rem;
            opacity: 0.9;
        }
        .sidebar .btn-toggle-nav .nav-link span {
            font-size: 0.93rem;
        }
        .main-content {
            min-width: 0;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 1000;
                width: 25%;
                max-width: 25%;
            }
            .main-content {
                margin-left: 25%;
            }
        }

        @media (min-width: 992px) {
            .sidebar {
                width: 16.666667%;
                max-width: 16.666667%;
            }
            .main-content {
                margin-left: 16.666667%;
            }
        }
        .sidebar::-webkit-scrollbar {
            width: 10px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #ced4da;
            border-radius: 999px;
            border: 2px solid #ffffff;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #adb5bd;
        }
        .sidebar-user-avatar {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #fb7185 0%, #8b5cf6 100%);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.18);
            flex-shrink: 0;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        html[data-bs-theme="dark"] .card {
            background-color: #182132;
            border-color: #2a3648;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table {
            --bs-table-color: #e5e7eb;
            --bs-table-bg: transparent;
            --bs-table-border-color: #334155;
            --bs-table-striped-color: #e5e7eb;
            --bs-table-striped-bg: rgba(148, 163, 184, 0.05);
            --bs-table-active-color: #f8fafc;
            --bs-table-active-bg: rgba(59, 130, 246, 0.12);
            --bs-table-hover-color: #f8fafc;
            --bs-table-hover-bg: rgba(59, 130, 246, 0.08);
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table > :not(caption) > * > * {
            color: inherit;
        }
        html[data-bs-theme="dark"] .table thead,
        html[data-bs-theme="dark"] .table-light,
        html[data-bs-theme="dark"] .bg-white {
            background-color: #182132 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .table-light > :not(caption) > * > *,
        html[data-bs-theme="dark"] .table > thead > tr > th {
            background-color: #182132 !important;
            color: #e5e7eb !important;
            border-bottom-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .table code {
            color: #f9a8d4;
        }
        html[data-bs-theme="dark"] .table .text-dark {
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .bg-light,
        html[data-bs-theme="dark"] .alert-light {
            background-color: #1f2937 !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .dropdown-menu {
            background-color: #182132;
            border-color: #2a3648;
        }
        html[data-bs-theme="dark"] .dropdown-item {
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .dropdown-item:hover,
        html[data-bs-theme="dark"] .dropdown-item:focus {
            color: #f8fafc;
            background-color: rgba(59, 130, 246, 0.12);
        }
        html[data-bs-theme="dark"] .dropdown-divider {
            border-top-color: #334155;
        }
        html[data-bs-theme="dark"] .text-muted {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .form-control,
        html[data-bs-theme="dark"] .form-select,
        html[data-bs-theme="dark"] .input-group-text,
        html[data-bs-theme="dark"] textarea.form-control {
            background-color: #111827 !important;
            border-color: #334155 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .form-control:focus,
        html[data-bs-theme="dark"] .form-select:focus,
        html[data-bs-theme="dark"] textarea.form-control:focus {
            background-color: #0f172a !important;
            border-color: #3b82f6 !important;
            color: #f8fafc !important;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.18) !important;
        }
        html[data-bs-theme="dark"] .form-control::placeholder,
        html[data-bs-theme="dark"] textarea.form-control::placeholder {
            color: #7c8aa0 !important;
        }
        html[data-bs-theme="dark"] .form-select option {
            background-color: #111827;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .input-group-text {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .text-bg-light,
        html[data-bs-theme="dark"] .badge.text-bg-light {
            background-color: #1e293b !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .list-group-item {
            background-color: #111827;
            color: #e5e7eb;
            border-color: #334155;
        }
        html[data-bs-theme="dark"] .list-group-item.active {
            background-color: rgba(59, 130, 246, 0.18);
            border-color: #3b82f6;
            color: #f8fafc;
        }
        html[data-bs-theme="dark"] .card-header.border-0 {
            border-bottom: 1px solid rgba(148, 163, 184, 0.12) !important;
        }
        .log-container {
            height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            border-radius: 0.375rem;
            font-size: 14px;
            white-space: pre;
            word-break: normal;
        }
    </style>
    <link href="/static/css/pages/backtest_training_list.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="backtest-shell pt-3">
    <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-3">
            <div class="metric-card metric-card--total h-100">
                <div class="metric-card__body">
                    <div class="metric-icon"><i class="bi bi-list-check"></i></div>
                    <div>
                        <div class="small fw-semibold text-body">任务总数</div>
                        <div class="metric-value mt-3 mb-2" id="totalTasks">0</div>
                        <div class="small text-body-secondary">当前全部数据回测任务</div>
                    </div>
                    <div class="metric-progress"><div class="metric-progress__bar" id="totalTasksBar"></div></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
            <div class="metric-card metric-card--running h-100">
                <div class="metric-card__body">
                    <div class="metric-icon"><i class="bi bi-play-fill"></i></div>
                    <div>
                        <div class="small fw-semibold text-body">运行中</div>
                        <div class="metric-value text-primary mt-3 mb-2" id="runningTasks">0</div>
                        <div class="small text-body-secondary">正在排队或执行中的任务</div>
                    </div>
                    <div class="metric-progress"><div class="metric-progress__bar" id="runningTasksBar"></div></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
            <div class="metric-card metric-card--completed h-100">
                <div class="metric-card__body">
                    <div class="metric-icon"><i class="bi bi-check2"></i></div>
                    <div>
                        <div class="small fw-semibold text-body">已完成</div>
                        <div class="metric-value text-success mt-3 mb-2" id="completedTasks">0</div>
                        <div class="small text-body-secondary">结果已落库，可直接查看</div>
                    </div>
                    <div class="metric-progress"><div class="metric-progress__bar" id="completedTasksBar"></div></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
            <div class="metric-card metric-card--failed h-100">
                <div class="metric-card__body">
                    <div class="metric-icon"><i class="bi bi-exclamation-lg"></i></div>
                    <div>
                        <div class="small fw-semibold text-body">执行失败</div>
                        <div class="metric-value text-danger mt-3 mb-2" id="failedTasks">0</div>
                        <div class="small text-body-secondary">包含系统错误或执行异常</div>
                    </div>
                    <div class="metric-progress"><div class="metric-progress__bar" id="failedTasksBar"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-body-tertiary border-0 p-4 d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="h4 mb-1 fw-bold text-body">数据回测中心</h1>
                <div class="text-body-secondary">统一查看与管理 C3 / C5 回测任务，实时追踪任务执行状态。</div>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
                <span class="badge text-bg-secondary rounded-pill px-3 py-2 fw-normal">
                    最后刷新：<span class="ms-1" id="lastUpdated">-</span>
                </span>
                <button type="button" class="btn btn-outline-success rounded-pill px-4" id="openBatchExportBtn">
                    <i class="bi bi-file-earmark-zip me-1"></i> 批量导出
                </button>
                <a href="/backtest-training/create" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-plus-lg me-1"></i> 创建新任务
                </a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">任务名称 & ID</th>
                        <th>模型版本</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th class="pe-4 text-end">操作</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
        <div class="list-toolbar p-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <span class="small text-body-secondary" id="paginationSummary">共 0 条任务</span>
                <select class="form-select form-select-sm page-size-select" id="pageSizeSelect" aria-label="每页任务数">
                    <option value="10">10 / 页</option>
                    <option value="20" selected>20 / 页</option>
                    <option value="50">50 / 页</option>
                    <option value="100">100 / 页</option>
                </select>
            </div>
            <nav aria-label="回测任务分页">
                <ul class="pagination pagination-sm mb-0" id="taskPagination"></ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade batch-export-modal" id="batchExportModal" tabindex="-1" aria-labelledby="batchExportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content shadow">
            <div class="modal-header bg-body-tertiary border-0 px-4 py-3">
                <div>
                    <h5 class="modal-title fw-bold" id="batchExportModalLabel">批量导出当前页任务</h5>
                    <div class="small text-body-secondary mt-1">已完成任务可选，导出为 ZIP。</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body p-4">
                <div class="batch-export-summary p-3 mb-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <div class="fw-semibold" id="batchExportSummary">当前页 0 个任务，可导出 0 个，已选 0 个</div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-light border" id="selectAllExportableBtn">全选当前页</button>
                        <button type="button" class="btn btn-sm btn-light border" id="selectCompletedOnlyBtn">仅已完成任务</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="clearBatchExportSelectionBtn">清空</button>
                    </div>
                </div>
                <div class="batch-export-task-list" id="batchExportTaskList"></div>
            </div>
            <div class="modal-footer bg-body-tertiary border-0 px-4 py-3">
                <div class="me-auto small text-body-secondary" id="batchExportHint">ZIP 内每个任务保留原全局预览 XLSX 格式。</div>
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success rounded-pill px-4" id="confirmBatchExportBtn" disabled>
                    <i class="bi bi-file-earmark-zip me-1"></i>导出 ZIP
                </button>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/common/business/task-list.js"></script>
    <script src="/static/js/pages/backtest_training_list.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建回测训练任务</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <link href="/static/css/pages/backtest_training_create.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="container-fluid py-4 create-shell">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <h1 class="h3 mb-1">创建回测训练任务</h1>
            <div class="text-body-secondary">识别 Google Sheet、选择股票、导入参数并创建任务。</div>
        </div>
        <a href="/backtest-training/list" class="btn btn-outline-secondary rounded-pill px-4">
            返回列表
        </a>
    </div>

    <div class="card create-card">
        <div class="card-body p-4">
            <div class="row g-3 align-items-end">
                <div class="col-xl-6">
                    <label for="modelUrl" class="form-label">Google Sheet 链接</label>
                    <div class="sheet-selector-shell">
                        <input type="text" class="form-control" id="modelUrl" placeholder="输入 Google Sheet 链接或 Sheet ID" autocomplete="off">
                        <div class="sheet-selector-results d-none" id="googleSheetMenuList">
                            <div class="px-3 py-3 small text-body-secondary">加载中...</div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4">
                    <label for="stockCode" class="form-label">股票代码</label>
                    <div class="stock-search-shell">
                        <input type="text" class="form-control" id="stockCode" placeholder="如 AAPL、MSFT、平安银行" autocomplete="off">
                        <div id="stockSearchResults" class="stock-search-results d-none"></div>
                    </div>
                </div>
                <div class="col-xl-2 d-grid">
                    <button type="button" class="btn btn-primary" id="analyzeBtn">
                        <i class="bi bi-search me-1"></i>识别链接
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card create-card">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="text-body-secondary small">任务配置</div>
                    <div class="fw-semibold">基础信息与年份范围</div>
                </div>
                <button
                    type="button"
                    class="config-toggle"
                    id="configToggleBtn"
                    data-bs-toggle="collapse"
                    data-bs-target="#taskConfigCollapse"
                    aria-expanded="false"
                    aria-controls="taskConfigCollapse"
                >
                    展开配置 <i class="bi bi-chevron-down ms-1"></i>
                </button>
            </div>

            <div class="collapse mt-3" id="taskConfigCollapse">
                <div class="card create-card sheet-info mb-3" id="sheetInfo">
                    <div class="card-body p-3">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="badge text-bg-primary" id="modelVersionBadge">C3</span>
                            <span class="fw-semibold" id="sheetTitle">-</span>
                        </div>
                        <div class="text-body-secondary small" id="sheetNames">-</div>
                    </div>
                </div>

                <div class="config-grid">
                    <div class="config-box">
                        <label for="taskName" class="form-label">任务名称</label>
                        <input type="text" class="form-control" id="taskName" placeholder="自动生成，例如 C3-NVDA">
                    </div>
                    <div class="config-box">
                        <label for="tokenId" class="form-label">回测 Token</label>
                        <select class="form-select" id="tokenId">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div class="config-box" id="commissionConfigGroup">
                        <label for="commissionInput" class="form-label">手续费</label>
                        <input type="text" class="form-control" id="commissionInput" value="0.0350%" placeholder="如 0.0350%">
                    </div>
                    <div class="config-box">
                        <label class="form-label d-block">市场类型</label>
                        <select class="form-select" id="market_type"></select>
                    </div>
                    <div class="config-box">
                        <label for="klineAdjustmentInput" class="form-label">K线复权</label>
                        <select class="form-select" id="klineAdjustmentInput">
                            <option value="forward" selected>前复权</option>
                            <option value="back">后复权</option>
                            <option value="none">不复权</option>
                        </select>
                    </div>
                    <div class="config-box">
                        <label for="priceModeInput" class="form-label">价格模式</label>
                        <select class="form-select" id="priceModeInput">
                            <option value="vwap_price">加权平均价</option>
                            <option value="kp_price">开盘价</option>
                            <option value="sp_price" selected>收盘价</option>
                            <option value="ohlc_price" disabled>OHLC（开高低收）</option>
                        </select>
                        <label for="klineDataSourceInput" class="form-label mt-2">K线数据源</label>
                        <select class="form-select" id="klineDataSourceInput">
                            <option value="akshare" selected>AKShare（默认）</option><option value="dfcf">东方财富</option>
                            <option value="qq">腾讯</option>
                            <option value="yahoo">Yahoo</option>
                            <option value="tdx">通达信（仅A股）</option>
                        </select>
                    </div>
                    <div class="config-box">
                        <label for="endDateInput" class="form-label">K 线截至日期</label>
                        <input type="date" class="form-control" id="endDateInput">
                        <div class="form-text">留空时使用运行日前一天；近 N 年会按该日期向前计算。</div>
                    </div>
                </div>

                <div class="config-grid mt-3">
                    <div class="config-box">
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
                            <label class="form-label mb-0" for="recentYearsCheck">近 N 年</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="recentYearsCheck">
                            </div>
                        </div>
                        <div id="recentYearsOptions">
                            <div class="year-options" id="recentYearsCheckboxes"></div>
                            <div class="year-display mt-2" id="recentYearsDisplay">未选择</div>
                            <div class="year-display" id="recentYearsInfoDisplay">用于按最近年份回测。</div>
                        </div>
                    </div>
                    <div class="config-box">
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
                            <label class="form-label mb-0" for="fullYearsCheck">完整年份</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="fullYearsCheck">
                            </div>
                        </div>
                        <div id="fullYearsOptions" class="d-none">
                            <div class="year-options" id="fullYearsCheckboxes"></div>
                            <div class="year-display mt-2" id="fullYearsDisplay">未选择</div>
                            <div class="year-display" id="fullYearsInfoDisplay">用于按完整自然年回测。</div>
                        </div>
                    </div>
                </div>

                <div class="mt-3" id="yearsContainerWrapper">
                    <div class="small text-body-secondary">当前年份配置</div>
                    <div class="fw-semibold" id="yearsDisplay">近 N 年：未选择；完整年份：未选择</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card create-card" id="paramSection">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <div class="fw-semibold">参数配置</div>
                    <div class="text-body-secondary small">支持手动录入或从 Excel 导入。</div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <input type="file" id="excelFileInput" class="d-none" accept=".xlsx,.xlsm">
                    <button type="button" class="btn btn-outline-secondary" id="importExcelBtn">
                        <i class="bi bi-file-earmark-excel me-1"></i>导入 Excel
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="paramHelpBtn" aria-label="查看粘贴与复制说明">
                        <i class="bi bi-exclamation-circle"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="pasteClipboardBtn">
                        <i class="bi bi-clipboard2-plus me-1"></i>粘贴追加
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="copyParamBtn">
                        <i class="bi bi-copy me-1"></i>复制参数
                    </button>
                    <button type="button" class="btn btn-outline-primary" id="addParamBtn">
                        <i class="bi bi-plus-lg me-1"></i>添加参数
                    </button>
                    <button type="button" class="btn btn-primary" id="createBtn">
                        <i class="bi bi-play-circle me-1"></i>创建任务
                    </button>
                </div>
            </div>

            <div id="excelImportStatus" class="small mb-3"></div>

            <div id="emptyHint" class="empty-hint">
                先识别模型或直接添加参数行。
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle parameter-table mb-0" id="paramTable">
                    <thead id="paramTableHead"></thead>
                    <tbody id="paramTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/backtest_training_create.js"></script>
</body>
</html>

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">

    <link href="/static/css/template-auth.css" rel="stylesheet">

    <style>
        :root {
            --bs-secondary-color: rgba(33, 37, 41, 0.75);
            --bs-tertiary-bg: #f8f9fa;
            --bs-emphasis-color: #000;
        }
        html[data-bs-theme="dark"] {
            --bs-body-color: #e5e7eb;
            --bs-body-bg: #111827;
            --bs-border-color: #334155;
            --bs-secondary-color: #94a3b8;
            --bs-tertiary-bg: #1f2937;
            --bs-emphasis-color: #f8fafc;
        }
        .text-body {
            color: var(--bs-body-color) !important;
        }
        .text-body-secondary {
            color: var(--bs-secondary-color) !important;
        }
        .bg-body {
            background-color: var(--bs-body-bg) !important;
        }
        .bg-body-tertiary {
            background-color: var(--bs-tertiary-bg) !important;
        }
        body {
            background-color: #f8f9fa;
        }
        html[data-bs-theme="dark"] body {
            background-color: #111827;
            color: #e5e7eb;
        }
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            overflow-y: scroll;
            overflow-x: hidden;
            border-right: 1px solid #e9ecef;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.04);
            scrollbar-gutter: stable;
            flex: 0 0 auto;
        }
        html[data-bs-theme="dark"] .sidebar {
            background: #111827;
            border-right-color: #243041;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.04);
        }
        .sidebar-brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, #0d6efd 0%, #4dabf7 100%);
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.18);
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #495057;
            padding: 0.65rem 0.85rem;
            border-radius: 0.75rem;
            margin-bottom: 0.2rem;
            font-weight: 500;
            transition: all 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link {
            color: #d1d5db;
        }
        .sidebar .nav-link:hover {
            color: #0d6efd;
            background-color: #f1f5ff;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link:hover {
            color: #93c5fd;
            background-color: rgba(59, 130, 246, 0.14);
        }
        .sidebar .nav-link.active {
            color: #0d6efd;
            background-color: #e7f1ff;
            box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.12);
        }
        html[data-bs-theme="dark"] .sidebar .nav-link.active {
            color: #bfdbfe;
            background-color: rgba(59, 130, 246, 0.18);
            box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.2);
        }
        .sidebar .btn-toggle {
            width: 100%;
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #343a40;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.8rem 0.85rem 0.55rem;
            border-radius: 0.75rem;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle {
            color: #e5e7eb;
        }
        .sidebar .btn-toggle:hover {
            background: #f8f9fa;
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #93c5fd;
        }
        .sidebar .btn-toggle-icon {
            transition: transform 0.2s ease;
            color: #868e96;
            font-size: 0.9rem;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle-icon {
            color: #94a3b8;
        }
        .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            transform: rotate(90deg);
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            color: #93c5fd;
        }
        .sidebar .btn-toggle-nav {
            padding-left: 0;
            margin: 0.1rem 0 0;
            list-style: none;
            padding-left: 0.15rem;
        }
        .sidebar .btn-toggle-nav li {
            margin: 0;
        }
        .sidebar .btn-toggle-nav .nav-link {
            margin-left: 0.25rem;
            padding: 0.48rem 0.75rem 0.48rem 0.85rem;
            white-space: nowrap;
            font-size: 0.93rem;
            font-weight: 500;
            border-radius: 0.7rem;
        }
        .sidebar .btn-toggle-nav .nav-link i {
            font-size: 0.92rem;
            opacity: 0.9;
        }
        .sidebar .btn-toggle-nav .nav-link span {
            font-size: 0.93rem;
        }
        .main-content {
            min-width: 0;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 1000;
                width: 25%;
                max-width: 25%;
            }
            .main-content {
                margin-left: 25%;
            }
        }

        @media (min-width: 992px) {
            .sidebar {
                width: 16.666667%;
                max-width: 16.666667%;
            }
            .main-content {
                margin-left: 16.666667%;
            }
        }
        .sidebar::-webkit-scrollbar {
            width: 10px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #ced4da;
            border-radius: 999px;
            border: 2px solid #ffffff;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #adb5bd;
        }
        .sidebar-user-avatar {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #fb7185 0%, #8b5cf6 100%);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.18);
            flex-shrink: 0;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        html[data-bs-theme="dark"] .card {
            background-color: #182132;
            border-color: #2a3648;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table {
            --bs-table-color: #e5e7eb;
            --bs-table-bg: transparent;
            --bs-table-border-color: #334155;
            --bs-table-striped-color: #e5e7eb;
            --bs-table-striped-bg: rgba(148, 163, 184, 0.05);
            --bs-table-active-color: #f8fafc;
            --bs-table-active-bg: rgba(59, 130, 246, 0.12);
            --bs-table-hover-color: #f8fafc;
            --bs-table-hover-bg: rgba(59, 130, 246, 0.08);
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table > :not(caption) > * > * {
            color: inherit;
        }
        html[data-bs-theme="dark"] .table thead,
        html[data-bs-theme="dark"] .table-light,
        html[data-bs-theme="dark"] .bg-white {
            background-color: #182132 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .table-light > :not(caption) > * > *,
        html[data-bs-theme="dark"] .table > thead > tr > th {
            background-color: #182132 !important;
            color: #e5e7eb !important;
            border-bottom-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .table code {
            color: #f9a8d4;
        }
        html[data-bs-theme="dark"] .table .text-dark {
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .bg-light,
        html[data-bs-theme="dark"] .alert-light {
            background-color: #1f2937 !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .dropdown-menu {
            background-color: #182132;
            border-color: #2a3648;
        }
        html[data-bs-theme="dark"] .dropdown-item {
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .dropdown-item:hover,
        html[data-bs-theme="dark"] .dropdown-item:focus {
            color: #f8fafc;
            background-color: rgba(59, 130, 246, 0.12);
        }
        html[data-bs-theme="dark"] .dropdown-divider {
            border-top-color: #334155;
        }
        html[data-bs-theme="dark"] .text-muted {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .form-control,
        html[data-bs-theme="dark"] .form-select,
        html[data-bs-theme="dark"] .input-group-text,
        html[data-bs-theme="dark"] textarea.form-control {
            background-color: #111827 !important;
            border-color: #334155 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .form-control:focus,
        html[data-bs-theme="dark"] .form-select:focus,
        html[data-bs-theme="dark"] textarea.form-control:focus {
            background-color: #0f172a !important;
            border-color: #3b82f6 !important;
            color: #f8fafc !important;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.18) !important;
        }
        html[data-bs-theme="dark"] .form-control::placeholder,
        html[data-bs-theme="dark"] textarea.form-control::placeholder {
            color: #7c8aa0 !important;
        }
        html[data-bs-theme="dark"] .form-select option {
            background-color: #111827;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .input-group-text {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .text-bg-light,
        html[data-bs-theme="dark"] .badge.text-bg-light {
            background-color: #1e293b !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .list-group-item {
            background-color: #111827;
            color: #e5e7eb;
            border-color: #334155;
        }
        html[data-bs-theme="dark"] .list-group-item.active {
            background-color: rgba(59, 130, 246, 0.18);
            border-color: #3b82f6;
            color: #f8fafc;
        }
        html[data-bs-theme="dark"] .card-header.border-0 {
            border-bottom: 1px solid rgba(148, 163, 184, 0.12) !important;
        }
        .log-container {
            height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            border-radius: 0.375rem;
            font-size: 14px;
            white-space: pre;
            word-break: normal;
        }
    </style>

<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="container-fluid py-4 create-shell">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <h1 class="h3 mb-1">创建回测训练任务</h1>
            <div class="text-body-secondary">识别 Google Sheet、选择股票、导入参数并创建任务。</div>
        </div>
        <a href="/backtest-training/list" class="btn btn-outline-secondary rounded-pill px-4">
            返回列表
        </a>
    </div>

    <div class="card create-card">
        <div class="card-body p-4">
            <div class="row g-3 align-items-end">
                <div class="col-xl-6">
                    <label for="modelUrl" class="form-label">Google Sheet 链接</label>
                    <div class="sheet-selector-shell">
                        <input type="text" class="form-control" id="modelUrl" placeholder="输入 Google Sheet 链接或 Sheet ID" autocomplete="off">
                        <div class="sheet-selector-results d-none" id="googleSheetMenuList">
                            <div class="px-3 py-3 small text-body-secondary">加载中...</div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4">
                    <label for="stockCode" class="form-label">股票代码</label>
                    <div class="stock-search-shell">
                        <input type="text" class="form-control" id="stockCode" placeholder="如 AAPL、MSFT、平安银行" autocomplete="off">
                        <div id="stockSearchResults" class="stock-search-results d-none"></div>
                    </div>
                </div>
                <div class="col-xl-2 d-grid">
                    <button type="button" class="btn btn-primary" id="analyzeBtn">
                        <i class="bi bi-search me-1"></i>识别链接
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card create-card">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="text-body-secondary small">任务配置</div>
                    <div class="fw-semibold">基础信息与年份范围</div>
                </div>
                <button
                    type="button"
                    class="config-toggle"
                    id="configToggleBtn"
                    data-bs-toggle="collapse"
                    data-bs-target="#taskConfigCollapse"
                    aria-expanded="false"
                    aria-controls="taskConfigCollapse"
                >
                    展开配置 <i class="bi bi-chevron-down ms-1"></i>
                </button>
            </div>

            <div class="collapse mt-3" id="taskConfigCollapse">
                <div class="card create-card sheet-info mb-3" id="sheetInfo">
                    <div class="card-body p-3">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="badge text-bg-primary" id="modelVersionBadge">C3</span>
                            <span class="fw-semibold" id="sheetTitle">-</span>
                        </div>
                        <div class="text-body-secondary small" id="sheetNames">-</div>
                    </div>
                </div>

                <div class="config-grid">
                    <div class="config-box">
                        <label for="taskName" class="form-label">任务名称</label>
                        <input type="text" class="form-control" id="taskName" placeholder="自动生成，例如 C3-NVDA">
                    </div>
                    <div class="config-box">
                        <label for="tokenId" class="form-label">回测 Token</label>
                        <select class="form-select" id="tokenId">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div class="config-box" id="commissionConfigGroup">
                        <label for="commissionInput" class="form-label">手续费</label>
                        <input type="text" class="form-control" id="commissionInput" value="0.0350%" placeholder="如 0.0350%">
                    </div>
                    <div class="config-box">
                        <label class="form-label d-block">市场类型</label>
                        <select class="form-select" id="market_type"></select>
                    </div>
                    <div class="config-box">
                        <label for="klineAdjustmentInput" class="form-label">K线复权</label>
                        <select class="form-select" id="klineAdjustmentInput">
                            <option value="forward" selected>前复权</option>
                            <option value="back">后复权</option>
                            <option value="none">不复权</option>
                        </select>
                    </div>
                    <div class="config-box">
                        <label for="priceModeInput" class="form-label">价格模式</label>
                        <select class="form-select" id="priceModeInput">
                            <option value="vwap_price">加权平均价</option>
                            <option value="kp_price">开盘价</option>
                            <option value="sp_price" selected>收盘价</option>
                            <option value="ohlc_price" disabled>OHLC（开高低收）</option>
                        </select>
                        <label for="klineDataSourceInput" class="form-label mt-2">K线数据源</label>
                        <select class="form-select" id="klineDataSourceInput">
                            <option value="dfcf" selected>东方财富（默认）</option>
                            <option value="qq">腾讯</option>
                            <option value="yahoo">Yahoo</option>
                            <option value="tdx">通达信（仅A股）</option>
                        </select>
                    </div>
                    <div class="config-box">
                        <label for="endDateInput" class="form-label">K 线截至日期</label>
                        <input type="date" class="form-control" id="endDateInput">
                        <div class="form-text">留空时使用运行日前一天；近 N 年会按该日期向前计算。</div>
                    </div>
                </div>

                <div class="config-grid mt-3">
                    <div class="config-box">
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
                            <label class="form-label mb-0" for="recentYearsCheck">近 N 年</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="recentYearsCheck">
                            </div>
                        </div>
                        <div id="recentYearsOptions">
                            <div class="year-options" id="recentYearsCheckboxes"></div>
                            <div class="year-display mt-2" id="recentYearsDisplay">未选择</div>
                            <div class="year-display" id="recentYearsInfoDisplay">用于按最近年份回测。</div>
                        </div>
                    </div>
                    <div class="config-box">
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
                            <label class="form-label mb-0" for="fullYearsCheck">完整年份</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="fullYearsCheck">
                            </div>
                        </div>
                        <div id="fullYearsOptions" class="d-none">
                            <div class="year-options" id="fullYearsCheckboxes"></div>
                            <div class="year-display mt-2" id="fullYearsDisplay">未选择</div>
                            <div class="year-display" id="fullYearsInfoDisplay">用于按完整自然年回测。</div>
                        </div>
                    </div>
                </div>

                <div class="mt-3" id="yearsContainerWrapper">
                    <div class="small text-body-secondary">当前年份配置</div>
                    <div class="fw-semibold" id="yearsDisplay">近 N 年：未选择；完整年份：未选择</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card create-card" id="paramSection">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <div class="fw-semibold">参数配置</div>
                    <div class="text-body-secondary small">支持手动录入或从 Excel 导入。</div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <input type="file" id="excelFileInput" class="d-none" accept=".xlsx,.xlsm">
                    <button type="button" class="btn btn-outline-secondary" id="importExcelBtn">
                        <i class="bi bi-file-earmark-excel me-1"></i>导入 Excel
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="paramHelpBtn" aria-label="查看粘贴与复制说明">
                        <i class="bi bi-exclamation-circle"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="pasteClipboardBtn">
                        <i class="bi bi-clipboard2-plus me-1"></i>粘贴追加
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="copyParamBtn">
                        <i class="bi bi-copy me-1"></i>复制参数
                    </button>
                    <button type="button" class="btn btn-outline-primary" id="addParamBtn">
                        <i class="bi bi-plus-lg me-1"></i>添加参数
                    </button>
                    <button type="button" class="btn btn-primary" id="createBtn">
                        <i class="bi bi-play-circle me-1"></i>创建任务
                    </button>
                </div>
            </div>

            <div id="excelImportStatus" class="small mb-3"></div>

            <div id="emptyHint" class="empty-hint">
                先识别模型或直接添加参数行。
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle parameter-table mb-0" id="paramTable">
                    <thead id="paramTableHead"></thead>
                    <tbody id="paramTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/backtest_training_create.js"></script>
</body>
</html>

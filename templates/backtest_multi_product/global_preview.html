<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多品全局预览</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>

    <style>
        :root {
            --bs-secondary-color: rgba(33, 37, 41, 0.75);
            --bs-tertiary-bg: #f8f9fa;
            --bs-emphasis-color: #000;
        }
        html[data-bs-theme="dark"] {
            --bs-body-color: #e5e7eb;
            --bs-body-bg: #111827;
            --bs-border-color: #334155;
            --bs-secondary-color: #94a3b8;
            --bs-tertiary-bg: #1f2937;
            --bs-emphasis-color: #f8fafc;
        }
        .text-body {
            color: var(--bs-body-color) !important;
        }
        .text-body-secondary {
            color: var(--bs-secondary-color) !important;
        }
        .bg-body {
            background-color: var(--bs-body-bg) !important;
        }
        .bg-body-tertiary {
            background-color: var(--bs-tertiary-bg) !important;
        }
        body {
            background-color: #f8f9fa;
        }
        html[data-bs-theme="dark"] body {
            background-color: #111827;
            color: #e5e7eb;
        }
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            overflow-y: scroll;
            overflow-x: hidden;
            border-right: 1px solid #e9ecef;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.04);
            scrollbar-gutter: stable;
            flex: 0 0 auto;
        }
        html[data-bs-theme="dark"] .sidebar {
            background: #111827;
            border-right-color: #243041;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.04);
        }
        .sidebar-brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, #0d6efd 0%, #4dabf7 100%);
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.18);
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #495057;
            padding: 0.65rem 0.85rem;
            border-radius: 0.75rem;
            margin-bottom: 0.2rem;
            font-weight: 500;
            transition: all 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link {
            color: #d1d5db;
        }
        .sidebar .nav-link:hover {
            color: #0d6efd;
            background-color: #f1f5ff;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link:hover {
            color: #93c5fd;
            background-color: rgba(59, 130, 246, 0.14);
        }
        .sidebar .nav-link.active {
            color: #0d6efd;
            background-color: #e7f1ff;
            box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.12);
        }
        html[data-bs-theme="dark"] .sidebar .nav-link.active {
            color: #bfdbfe;
            background-color: rgba(59, 130, 246, 0.18);
            box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.2);
        }
        .sidebar .btn-toggle {
            width: 100%;
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #343a40;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.8rem 0.85rem 0.55rem;
            border-radius: 0.75rem;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle {
            color: #e5e7eb;
        }
        .sidebar .btn-toggle:hover {
            background: #f8f9fa;
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #93c5fd;
        }
        .sidebar .btn-toggle-icon {
            transition: transform 0.2s ease;
            color: #868e96;
            font-size: 0.9rem;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle-icon {
            color: #94a3b8;
        }
        .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            transform: rotate(90deg);
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            color: #93c5fd;
        }
        .sidebar .btn-toggle-nav {
            padding-left: 0;
            margin: 0.1rem 0 0;
            list-style: none;
            padding-left: 0.15rem;
        }
        .sidebar .btn-toggle-nav li {
            margin: 0;
        }
        .sidebar .btn-toggle-nav .nav-link {
            margin-left: 0.25rem;
            padding: 0.48rem 0.75rem 0.48rem 0.85rem;
            white-space: nowrap;
            font-size: 0.93rem;
            font-weight: 500;
            border-radius: 0.7rem;
        }
        .sidebar .btn-toggle-nav .nav-link i {
            font-size: 0.92rem;
            opacity: 0.9;
        }
        .sidebar .btn-toggle-nav .nav-link span {
            font-size: 0.93rem;
        }
        .main-content {
            min-width: 0;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 1000;
                width: 25%;
                max-width: 25%;
            }
            .main-content {
                margin-left: 25%;
            }
        }

        @media (min-width: 992px) {
            .sidebar {
                width: 16.666667%;
                max-width: 16.666667%;
            }
            .main-content {
                margin-left: 16.666667%;
            }
        }
        .sidebar::-webkit-scrollbar {
            width: 10px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #ced4da;
            border-radius: 999px;
            border: 2px solid #ffffff;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #adb5bd;
        }
        .sidebar-user-avatar {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #fb7185 0%, #8b5cf6 100%);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.18);
            flex-shrink: 0;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        html[data-bs-theme="dark"] .card {
            background-color: #182132;
            border-color: #2a3648;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table {
            --bs-table-color: #e5e7eb;
            --bs-table-bg: transparent;
            --bs-table-border-color: #334155;
            --bs-table-striped-color: #e5e7eb;
            --bs-table-striped-bg: rgba(148, 163, 184, 0.05);
            --bs-table-active-color: #f8fafc;
            --bs-table-active-bg: rgba(59, 130, 246, 0.12);
            --bs-table-hover-color: #f8fafc;
            --bs-table-hover-bg: rgba(59, 130, 246, 0.08);
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table > :not(caption) > * > * {
            color: inherit;
        }
        html[data-bs-theme="dark"] .table thead,
        html[data-bs-theme="dark"] .table-light,
        html[data-bs-theme="dark"] .bg-white {
            background-color: #182132 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .table-light > :not(caption) > * > *,
        html[data-bs-theme="dark"] .table > thead > tr > th {
            background-color: #182132 !important;
            color: #e5e7eb !important;
            border-bottom-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .table code {
            color: #f9a8d4;
        }
        html[data-bs-theme="dark"] .table .text-dark {
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .bg-light,
        html[data-bs-theme="dark"] .alert-light {
            background-color: #1f2937 !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .dropdown-menu {
            background-color: #182132;
            border-color: #2a3648;
        }
        html[data-bs-theme="dark"] .dropdown-item {
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .dropdown-item:hover,
        html[data-bs-theme="dark"] .dropdown-item:focus {
            color: #f8fafc;
            background-color: rgba(59, 130, 246, 0.12);
        }
        html[data-bs-theme="dark"] .dropdown-divider {
            border-top-color: #334155;
        }
        html[data-bs-theme="dark"] .text-muted {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .form-control,
        html[data-bs-theme="dark"] .form-select,
        html[data-bs-theme="dark"] .input-group-text,
        html[data-bs-theme="dark"] textarea.form-control {
            background-color: #111827 !important;
            border-color: #334155 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .form-control:focus,
        html[data-bs-theme="dark"] .form-select:focus,
        html[data-bs-theme="dark"] textarea.form-control:focus {
            background-color: #0f172a !important;
            border-color: #3b82f6 !important;
            color: #f8fafc !important;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.18) !important;
        }
        html[data-bs-theme="dark"] .form-control::placeholder,
        html[data-bs-theme="dark"] textarea.form-control::placeholder {
            color: #7c8aa0 !important;
        }
        html[data-bs-theme="dark"] .form-select option {
            background-color: #111827;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .input-group-text {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .text-bg-light,
        html[data-bs-theme="dark"] .badge.text-bg-light {
            background-color: #1e293b !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .list-group-item {
            background-color: #111827;
            color: #e5e7eb;
            border-color: #334155;
        }
        html[data-bs-theme="dark"] .list-group-item.active {
            background-color: rgba(59, 130, 246, 0.18);
            border-color: #3b82f6;
            color: #f8fafc;
        }
        html[data-bs-theme="dark"] .card-header.border-0 {
            border-bottom: 1px solid rgba(148, 163, 184, 0.12) !important;
        }
        .log-container {
            height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            border-radius: 0.375rem;
            font-size: 14px;
            white-space: pre;
            word-break: normal;
        }
    </style>
    <link href="/static/css/pages/backtest_multi_product_global_preview.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="container-fluid py-4 preview-layout">
    <div class="header-toolbar shadow-sm">
        <div class="header-toolbar-left">
            <div class="text-body-secondary small">多品数据回测</div>
            <div class="fw-bold" id="taskTitleText">加载中...</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-primary rounded-pill px-3 btn-sm" id="saveRatiosBtn" type="button">
                <i class="bi bi-save me-1"></i>保存比例
            </button>
            <button class="btn btn-outline-success rounded-pill px-3 btn-sm" id="exportBtn" type="button">
                <i class="bi bi-file-earmark-excel me-1"></i>导出 XLSX
            </button>
            <button class="btn btn-outline-info rounded-pill px-3 btn-sm" id="exportWordBtn" type="button">
                <i class="bi bi-file-earmark-word me-1"></i>导出 Word
            </button>
            <a href="/backtest-multi-product/detail/" class="btn btn-outline-secondary rounded-pill px-3 btn-sm" id="backToDetailLink">
                <i class="bi bi-arrow-left me-1"></i>返回详情
            </a>
        </div>
    </div>

    <details class="summary-panel shadow-sm">
        <summary class="summary-toggle">
            <span class="fw-semibold">任务概要</span>
            <span class="text-body-secondary small">点击展开 4 项信息 <i class="bi bi-chevron-down ms-1 summary-toggle-icon"></i></span>
        </summary>
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-card-label">任务 ID</div>
                <div class="summary-card-value" id="summaryTaskId"></div>
            </div>
            <div class="summary-card">
                <div class="summary-card-label">产品数</div>
                <div class="summary-card-value" id="summaryProducts">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-card-label">参数方案</div>
                <div class="summary-card-value" id="summaryGroups">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-card-label">成功结果</div>
                <div class="summary-card-value text-success" id="summarySuccess">-</div>
            </div>
        </div>
    </details>

    <details class="summary-panel shadow-sm" id="ratioPanel">
        <summary class="summary-toggle">
            <span class="fw-semibold">比例设置</span>
            <span class="text-body-secondary small">
                <span id="ratioTotalBadge" class="ratio-total-badge">合计 -</span>
                <i class="bi bi-chevron-down ms-1 summary-toggle-icon"></i>
            </span>
        </summary>
        <div class="px-3 pb-3">
            <div class="ratio-toolbar mb-2">
                <div>
                    <select class="form-select" id="groupSelect" style="min-width: 220px;"></select>
                </div>
                <div class="ratio-formula-hint">
                    <span class="hint-title">比例计算：</span>
                    <span class="hint-desc">先将累计收益率转换为当天收益率，按比例合成后复利还原为组合累计收益率，再重新计算组合指标。</span>
                    <br><span class="hint-note">比例计算-指数来自组合 index_return，比例计算-结果来自组合 start_return；导出也使用同一套后端计算。</span>
                </div>
                <button class="btn btn-primary rounded-pill px-4" id="calculateRatiosBtn" type="button">
                    <i class="bi bi-calculator me-1"></i>计算预览
                </button>
            </div>
            <div class="ratio-list-wrap" id="ratioListWrap">
                <table class="ratio-list-table">
                    <thead>
                        <tr>
                            <th>产品</th>
                            <th>比例</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="ratioListBody"></tbody>
                </table>
            </div>
        </div>
    </details>

    <div class="preview-table-wrap" id="previewContainer">
        <div class="empty-state">正在加载多品全局预览数据...</div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/backtest_multi_product_global_preview.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回测任务详情</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <link href="/static/css/pages/backtest_multi_product_detail.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="pt-3 pb-4 d-grid gap-4">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-body-tertiary border-0 p-4 d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h5 class="mb-1 fw-bold"><i class="bi bi-info-circle text-primary me-2"></i>基础执行信息</h5>
                <div class="d-flex align-items-center gap-3 flex-wrap mt-1">
                    <div class="fw-semibold text-body" id="taskNameText">任务详情</div>
                    <span>Task ID:</span>
                    <code class="bg-body px-2 py-1 rounded text-primary fs-6" id="taskIdText"></code>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <a href="/backtest-multi-product/list" class="btn btn-outline-secondary rounded-pill px-4" id="backToListLink">
                    <i class="bi bi-arrow-left"></i> 返回列表
                </a>
            </div>
        </div>
        <div class="card-body p-4">
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="text-body-secondary small mb-1">当前状态</div>
                    <div class="fw-semibold" id="taskStatus"></div>
                </div>
                <div class="col-md-3">
                    <div class="text-body-secondary small mb-1">创建时间</div>
                    <div class="fw-semibold" id="taskCreated"><span class="placeholder col-6"></span></div>
                </div>
                <div class="col-md-3">
                    <div class="text-body-secondary small mb-1">开始执行时间</div>
                    <div class="fw-semibold" id="taskStart"><span class="placeholder col-6"></span></div>
                </div>
                <div class="col-md-3">
                    <div class="text-body-secondary small mb-1">结束时间</div>
                    <div class="fw-semibold" id="taskEnd"><span class="placeholder col-6"></span></div>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-4">
                <a href="/backtest-multi-product/global-preview/" class="btn btn-outline-success rounded-pill px-4" id="globalPreviewLink">
                    <i class="bi bi-layout-text-window-reverse me-1"></i> 全局预览页
                </a>
                <button type="button" class="btn btn-warning rounded-pill px-4" id="stopTaskBtn" disabled>
                    <i class="bi bi-stop-circle me-1"></i> 停止任务
                </button>
                <button type="button" class="btn btn-outline-warning rounded-pill px-4" id="resumeRestartTaskBtn">
                    <i class="bi bi-skip-forward-circle me-1"></i> 断点重启
                </button>
                <button type="button" class="btn btn-outline-danger rounded-pill px-4" id="restartFromScratchBtn">
                    <i class="bi bi-bootstrap-reboot me-1"></i> 重头开始
                </button>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-body-tertiary border-0 p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <button
                class="btn btn-link text-decoration-none p-0 fw-bold text-body d-flex align-items-center"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#taskConfigCollapse"
                aria-expanded="false"
                aria-controls="taskConfigCollapse"
                id="taskConfigToggle"
            >
                <i class="bi bi-ui-checks-grid text-primary me-2"></i>
                <span>任务运行配置</span>
                <i class="bi bi-chevron-right ms-2" id="taskConfigToggleIcon"></i>
            </button>
        </div>
        <div class="collapse" id="taskConfigCollapse">
            <div class="card-body p-4">
                <div class="task-config-grid" id="taskConfigGrid"></div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden param-card">
        <div class="card-header bg-body-tertiary border-0 p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <button
                class="btn btn-link text-decoration-none p-0 fw-bold text-body d-flex align-items-center"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#taskParamCollapse"
                aria-expanded="true"
                aria-controls="taskParamCollapse"
                id="taskParamToggle"
            >
                <i class="bi bi-sliders text-success me-2"></i>
                <span>任务输入参数</span>
                <i class="bi bi-chevron-down ms-2" id="taskParamToggleIcon"></i>
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="copyTaskParamsBtn">
                <i class="bi bi-copy me-1"></i>复制全部参数
            </button>
        </div>
        <div class="collapse show" id="taskParamCollapse">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="taskParamTable">
                    <thead class="table-light" id="taskParamHead"></thead>
                    <tbody id="taskParamBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-body-tertiary border-0 p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <button
                class="btn btn-link text-decoration-none p-0 fw-bold text-body d-flex align-items-center"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#taskResultCollapse"
                aria-expanded="true"
                aria-controls="taskResultCollapse"
                id="taskResultToggle"
            >
                <i class="bi bi-clipboard-data text-warning me-2"></i>
                <span id="taskResultSectionTitle">回测生成结果</span>
                <i class="bi bi-chevron-down ms-2" id="taskResultToggleIcon"></i>
            </button>
        </div>
        <div class="collapse show" id="taskResultCollapse">
            <div id="c5TaskResultView">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">结果 ID</th>
                                <th>执行参数</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th class="pe-4 text-end">操作</th>
                            </tr>
                        </thead>
                        <tbody id="subTaskTableBody"></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 px-4 py-3 border-top bg-body-tertiary">
                    <div class="small text-body-secondary" id="taskResultPaginationSummary">共 0 条结果</div>
                    <nav aria-label="回测结果分页">
                        <ul class="pagination pagination-sm mb-0" id="taskResultPagination"></ul>
                    </nav>
                </div>
            </div>
            <div id="c3SummaryView" class="d-none">
                <div class="summary-toolbar">
                    <div class="small text-body-secondary" id="c3SummaryMetricHint">默认显示当前汇总字段，可按需勾选更多数据库指标。</div>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#c3MetricSelectorModal">
                        <i class="bi bi-sliders me-1"></i> 选择数据项
                    </button>
                </div>
                <div class="summary-table-wrap">
                    <table class="table table-hover align-middle mb-0 summary-table">
                        <thead class="table-light" id="c3SummaryTableHead"></thead>
                        <tbody id="c3SummaryTableBody">
                            <tr>
                                <td colspan="22" class="text-center text-body-secondary py-4">正在加载参数汇总...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-body-tertiary border-0 p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <button
                class="btn btn-link text-decoration-none p-0 fw-bold text-body d-flex align-items-center"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#taskLogCollapse"
                aria-expanded="true"
                aria-controls="taskLogCollapse"
                id="taskLogToggle"
            >
                <i class="bi bi-journal-text text-primary me-2"></i>
                <span>任务日志</span>
                <i class="bi bi-chevron-down ms-2" id="taskLogToggleIcon"></i>
            </button>
            <div class="d-flex align-items-center gap-3 flex-wrap small text-body-secondary">
                <span>自动刷新：1 分钟</span>
                <span id="logLastUpdated">最近刷新：-</span>
                <button type="button" class="btn btn-outline-primary btn-sm" id="manualRefreshBtn">
                    <i class="bi bi-arrow-clockwise"></i> 刷新日志
                </button>
            </div>
        </div>
        <div class="collapse show" id="taskLogCollapse">
            <div class="card-body p-4">
                <div class="log-container" id="log-container">日志加载中...</div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="c3MetricSelectorModal" tabindex="-1" aria-labelledby="c3MetricSelectorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h5 class="modal-title" id="c3MetricSelectorModalLabel">选择汇总表数据项</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="summary-config-grid" id="c3MetricSelectorList"></div>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-outline-secondary" id="resetC3MetricSelectionBtn">恢复默认</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">完成</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="productParameterModal" tabindex="-1" aria-labelledby="productParameterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="productParameterModalLabel">产品参数详情</h5>
                    <div class="small text-body-secondary" id="productParameterModalSubtitle"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body" id="productParameterModalBody">
                <div class="text-center text-body-secondary py-4">暂无参数</div>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/backtest_multi_product_detail.js"></script>
</body>
</html>

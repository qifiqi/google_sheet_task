<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - Google Sheet C4 参数批量校验</title>
<link href="/static/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/font/bootstrap-icons.css" rel="stylesheet">
<link href="/static/css/template-auth.css" rel="stylesheet">
<link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/common/components.css" rel="stylesheet">
<link href="/static/css/pages/google_sheet_c4_detail.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div data-navbar></div>

    <div class="container mt-4" data-template-main-content>
<div class="row">
    <div class="col-md-12">
        <!-- 任务概览卡片 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h4 class="card-title mb-0">
                    <i class="bi bi-info-circle"></i> 任务概览
                </h4>
                <div class="d-flex flex-wrap gap-2" role="group">
                    <button class="btn btn-warning btn-sm d-none" id="cancel-task-btn">
                        <i class="bi bi-stop-circle"></i> 停止任务
                    </button>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-info btn-sm dropdown-toggle d-none" data-bs-toggle="dropdown" id="restart-dropdown-btn">
                            <i class="bi bi-arrow-clockwise"></i> 重启任务
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="restartTask(true)">
                                <i class="bi bi-play-circle"></i> 从断点重启
                            </a></li>
                            <li><a class="dropdown-item" href="#" onclick="restartTask(false)">
                                <i class="bi bi-arrow-repeat"></i> 从头重启
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="goToCreateRestartTask()">
                                <i class="bi bi-plus-circle"></i> 跳转到创建重启任务
                            </a></li>
                        </ul>
                    </div>
                    <button class="btn btn-outline-info btn-sm" id="check-status-btn" onclick="checkTaskStatus()">
                        <i class="bi bi-search"></i> 检查状态
                    </button>
                    <a id="global-preview-link" href="/global-preview/single-product" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-eye"></i> 全局预览
                    </a>
                    <a href="/google-sheet/?version=c4" class="btn btn-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> 返回首页
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="card bg-body-tertiary h-100 border-0">
                            <div class="card-body">
                                <h6 class="card-title text-muted mb-3">任务信息</h6>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>任务名称:</strong></div>
                                    <div class="col-8 text-primary" id="task-name">-</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>任务ID:</strong></div>
                                    <div class="col-8 text-muted small" id="task-id">-</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>状态:</strong></div>
                                    <div class="col-8" id="task-status">-</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>进度:</strong></div>
                                    <div class="col-8" id="task-progress">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card bg-body-tertiary h-100 border-0">
                            <div class="card-body">
                                <h6 class="card-title text-muted mb-3">时间信息</h6>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>创建时间:</strong></div>
                                    <div class="col-8 text-success" id="create-time">-</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>开始时间:</strong></div>
                                    <div class="col-8 text-success" id="start-time">-</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>结束时间:</strong></div>
                                    <div class="col-8 text-info" id="end-time">-</div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-4"><strong>执行时长:</strong></div>
                                    <div class="col-8 text-warning" id="execution-duration">-</div>
                                </div>
                                <div class="row mb-2 d-none" id="error-info">
                                    <div class="col-4"><strong>错误信息:</strong></div>
                                    <div class="col-8 text-danger" id="error-message">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card bg-primary text-white h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title">执行统计</h5>
                                <div class="row text-center">
                                    <div class="col-6">
                                        <h3 id="success-count">0</h3>
                                        <small>成功</small>
                                    </div>
                                    <div class="col-6">
                                        <h3 id="failed-count">0</h3>
                                        <small>失败</small>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <div class="progress" style="height: 8px;">
                                        <div class="progress-bar bg-success" id="success-progress" style="width: 0%"></div>
                                    </div>
                                    <small class="mt-1 d-block">成功率</small>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 配置信息卡片 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h4 class="card-title mb-0">
                    <i class="bi bi-gear"></i> 配置信息
                </h4>
                <button class="btn btn-primary btn-sm d-none" id="edit-config-btn" onclick="goEditTaskConfig()">
                    <i class="bi bi-pencil"></i> 编辑配置
                </button>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">Google Sheet 配置</h6>
                        <div id="config-container">
                            <!-- 配置信息将通过JavaScript动态填充 -->
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">参数配置</h6>
                        <div id="parameters-container">
                            <!-- 参数信息将通过JavaScript动态填充 -->
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <div id="more-config-container">
                            <!-- 更多参数将通过JavaScript动态填充 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">
                    <i class="bi bi-journal-text"></i> 任务日志
                </h4>
            </div>
            <div class="card-body">
                <div class="log-container" id="log-container">
                    <!-- 日志内容将通过JavaScript动态填充 -->
                </div>
            </div>
        </div>

        <!-- 执行结果卡片 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h4 class="card-title mb-0">
                    <i class="bi bi-list-check"></i> 执行结果
                </h4>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="refreshResults()">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                    <button type="button" class="btn btn-outline-success btn-sm" onclick="exportResultsToCSV(this)">
                        <i class="bi bi-file-earmark-spreadsheet"></i> 导出 CSV
                    </button>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-funnel"></i> 筛选
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="Biz.taskPolling.filterResults('all')">全部结果</a></li>
                            <li><a class="dropdown-item" href="#" onclick="Biz.taskPolling.filterResults('success')">成功</a></li>
                            <li><a class="dropdown-item" href="#" onclick="Biz.taskPolling.filterResults('failed')">失败</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div id="results-summary" class="mb-3 small text-muted"></div>

                <div id="results-list" class="row g-3">
                    <!-- 结果卡片将通过JavaScript动态填充 -->
                </div>

                <!-- 分页控件 -->
                <nav aria-label="结果分页">
                    <ul class="pagination justify-content-center" id="results-pagination">
                        <!-- 分页按钮将通过JavaScript动态生成 -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- 结果详情模态框 -->
<div class="modal fade" id="resultDetailModal" tabindex="-1" aria-labelledby="resultDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="resultDetailModalLabel">结果详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="result-detail-meta" class="mb-3"></div>
                <div id="result-detail-body"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑配置弹窗已迁移：编辑统一走创建页 edit 模式（/google-sheet/create?version=c4&edit_task_id=...） -->

    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
        <script src="/static/js/common/business/task-polling.js"></script>
    <script src="/static/js/common/business/config-edit.js"></script>
<script src="/static/js/pages/google_sheet_c4_detail.js"></script>
</body>
</html>

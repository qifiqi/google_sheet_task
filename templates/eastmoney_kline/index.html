<!doctype html>
<html style="height: 100%; width: 100%">
  <head>
    <meta charset="utf-8" />
    <title>东方财富K线</title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/layui@2.9.23/dist/css/layui.css" rel="stylesheet" />
      <link href="/static/eastmoney-kline/css/extend.css" rel="stylesheet"/>
  </head>

  <body class="index-body">
    <div class="search">
      <form class="layui-form" lay-filter="form-val-filter">
        <div class="layui-row">
          <div class="layui-input-wrap">
            <label class="layui-input-label stock-keyword-label">股票查询：</label>
            <div class="stock-search-control">
              <input
                type="text"
                id="stock-keyword"
                placeholder="输入股票代码或名称"
                autocomplete="off"
                class="layui-input"
                aria-autocomplete="list"
                aria-controls="stock-suggestions"
                aria-expanded="false"
              />
              <div id="stock-suggestions" class="stock-suggestions" role="listbox" hidden></div>
            </div>
          </div>
        </div>
        <div class="layui-row">
          <div class="layui-input-wrap">
            <label class="layui-input-label">K线周期：</label>
            <select name="klt">
              <option value="101" selected>日K</option>
              <option value="102">周K</option>
              <option value="103">月K</option>
              <option value="1">1分钟</option>
              <option value="5">5分钟</option>
              <option value="15">15分钟</option>
              <option value="30">30分钟</option>
              <option value="60">60分钟</option>
            </select>
          </div>
        </div>
        <div class="layui-row">
          <div class="layui-input-wrap">
            <label class="layui-input-label">条数：</label>
            <input
              type="number"
              name="lmt"
              value="2000"
              min="2"
              max="10000"
              class="layui-input"
              lay-verify="required|number|lmt"
            />
          </div>
        </div>
        <div class="layui-row">
          <div class="layui-input-wrap">
            <label class="layui-input-label">复权方式：</label>
            <select name="fqt">
              <option value="0">不复权</option>
              <option value="1" selected>前复权</option>
              <option value="2">后复权</option>
            </select>
          </div>
        </div>
        <button
          type="submit"
          class="layui-btn layui-btn-normal layui-btn-radius kline-submit"
          lay-submit
          lay-filter="search-btn"
        >
          <i class="layui-icon layui-icon-search layui-font-18"></i>
          拉取K线
        </button>
      </form>
    </div>

    <div class="volatility-analysis" id="volatility-analysis" hidden>
      <div class="analysis-header">
        <span class="title">股票波动率分析</span>
        <div class="analysis-controls layui-form">
          <div class="analysis-basis">
            <label for="volatility-price-basis">计算价格：</label>
            <select id="volatility-price-basis" lay-filter="volatility-price-basis">
              <option value="vwap" selected>VWAP</option>
              <option value="open">开盘价</option>
              <option value="close">收盘价</option>
              <option value="high">最高价</option>
              <option value="low">最低价</option>
            </select>
          </div>
          <div class="analysis-basis">
            <label for="volatility-reference-date">计算基准日期：</label>
            <input id="volatility-reference-date" class="layui-input" readonly />
          </div>
        </div>
      </div>
      <div class="analysis-summary" id="analysis-summary"></div>
      <div class="volatility-comparison-wrap">
        <table class="layui-table volatility-comparison">
          <thead>
            <tr>
              <th>指标</th>
              <th>半年</th>
              <th>1年</th>
              <th>2年</th>
              <th>3年</th>
              <th>4年</th>
              <th>5年</th>
              <th>6年</th>
              <th>7年</th>
              <th>汇总</th>
            </tr>
          </thead>
          <tbody id="volatility-comparison-body"></tbody>
        </table>
      </div>
      <div class="average-turnover-analysis">
        <div class="average-turnover-header">
          <span>平均成交额分析</span>
          <small>按计算基准日期分段计算</small>
        </div>
        <div class="volatility-comparison-wrap">
          <table class="layui-table volatility-comparison">
            <thead>
              <tr>
                <th>指标</th>
                <th>第1年</th>
                <th>第2年</th>
                <th>第3年</th>
                <th>第4年</th>
                <th>第5年</th>
                <th>第6年</th>
                <th>第7年</th>
                <th>总体</th>
              </tr>
            </thead>
            <tbody id="average-turnover-comparison-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="table">
      <div class="table-header">
        <span class="title">
          东方财富K线数据
          <small class="table-meta" id="table-meta" hidden></small>
        </span>
        <span class="operate">
          <input
            id="export-file-name"
            type="text"
            class="layui-input export-file-name"
            placeholder="自定义导出文件名"
            aria-label="导出文件名"
          />
          <div class="layui-form export-date-order">
            <label for="export-date-order">导出日期：</label>
            <select id="export-date-order" aria-label="导出日期排序">
              <option value="asc" selected>日期升序</option>
              <option value="desc">日期降序</option>
            </select>
          </div>
          <button id="export-btn" type="button" class="layui-btn layui-btn-primary" disabled>
            <i class="layui-icon layui-icon-export"></i>
            导出Excel
          </button>
        </span>
      </div>
      <table class="layui-hide" id="table-container" lay-filter="table-filter"></table>
    </div>

    <script src="https://cdn.staticfile.org/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.23/dist/layui.js"></script>
    <script src="/static/eastmoney-kline/js/utils.js"></script>
    <script src="/static/eastmoney-kline/js/http/eastMoneyKlineApi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="/static/eastmoney-kline/js/excelExport.js"></script>
        <script src="/static/js/pages/eastmoney_kline_index.js"></script>
        <link href="/static/css/pages/eastmoney_kline_index.css" rel="stylesheet">
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方财富 K 线 - Jaspil 任务管理系统</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/pages/eastmoney_kline_index.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid py-3 px-3 px-md-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-2 pb-2 mb-3 border-bottom">
            <h1 class="h3 mb-0">K线数据</h1>
            <span class="text-body-secondary small">经本服务 K 线接口拉取，支持多数据源</span>
        </div>

        <div id="messageBox" class="alert alert-danger d-none mb-3" role="alert"></div>

        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body py-3">
                <form id="kline-query-form" class="row g-3 align-items-end" novalidate>
                    <div class="col-12 col-lg-3">
                        <label class="form-label mb-1" for="stock-keyword">股票查询</label>
                        <div class="stock-search-control position-relative">
                            <input
                                type="text"
                                id="stock-keyword"
                                class="form-control"
                                placeholder="输入股票代码或名称"
                                autocomplete="off"
                                aria-autocomplete="list"
                                aria-controls="stock-suggestions"
                                aria-expanded="false"
                            />
                            <div id="stock-suggestions" class="stock-suggestions" role="listbox" hidden></div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label mb-1" for="kline-period">K线周期</label>
                        <select id="kline-period" class="form-select">
                            <option value="101" selected>日K</option>
                            <option value="102">周K</option>
                            <option value="103">月K</option>
                            <option value="1">1分钟</option>
                            <option value="5">5分钟</option>
                            <option value="15">15分钟</option>
                            <option value="30">30分钟</option>
                            <option value="60">60分钟</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label mb-1" for="kline-data-source">数据源</label>
                        <select id="kline-data-source" class="form-select">
                            <option value="dfcf" selected>东方财富</option>
                            <option value="qq">腾讯</option>
                            <option value="akshare">AKShare</option>
                            <option value="tdx">通达信（仅A股）</option>
                            <option value="yahoo">Yahoo</option>
                            <option value="database">内置K线库</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label mb-1" for="kline-limit">条数</label>
                        <input
                            type="number"
                            id="kline-limit"
                            class="form-control"
                            value="2000"
                            min="2"
                            max="10000"
                            required
                        />
                        <div class="invalid-feedback">获取条数应为 2 至 10000 的整数</div>
                    </div>
                    <div class="col-6 col-lg-1">
                        <label class="form-label mb-1" for="kline-adjust">复权</label>
                        <select id="kline-adjust" class="form-select">
                            <option value="0">不复权</option>
                            <option value="1" selected>前复权</option>
                            <option value="2">后复权</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-2 d-grid">
                        <button type="submit" class="btn btn-primary" id="fetch-btn">
                            <i class="bi bi-search me-1"></i>拉取K线
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-3" id="volatility-analysis" hidden>
            <div class="card-header bg-white border-0 py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <span class="fw-semibold"><i class="bi bi-activity text-primary me-2"></i>股票波动率分析</span>
                <div class="d-flex flex-wrap align-items-center gap-3 small">
                    <label class="d-flex align-items-center gap-2 mb-0">
                        计算价格
                        <select id="volatility-price-basis" class="form-select form-select-sm">
                            <option value="vwap">VWAP</option>
                            <option value="close" selected>收盘价</option>
                            <option value="open">开盘价</option>
                            <option value="high">最高价</option>
                            <option value="low">最低价</option>
                        </select>
                    </label>
                    <label class="d-flex align-items-center gap-2 mb-0">
                        计算基准日期
                        <input id="volatility-reference-date" type="date" class="form-control form-control-sm" />
                    </label>
                </div>
            </div>
            <div class="card-body pt-2">
                <div class="analysis-summary d-flex flex-wrap gap-2 mb-3" id="analysis-summary"></div>
                <div class="table-responsive mb-3">
                    <table class="table table-sm table-bordered align-middle text-center volatility-comparison">
                        <thead class="table-light">
                            <tr>
                                <th>指标</th>
                                <th>半年</th>
                                <th>1年</th>
                                <th>2年</th>
                                <th>3年</th>
                                <th>4年</th>
                                <th>5年</th>
                                <th>6年</th>
                                <th>7年</th>
                                <th>汇总</th>
                            </tr>
                        </thead>
                        <tbody id="volatility-comparison-body"></tbody>
                    </table>
                </div>
                <div class="fw-semibold mb-2">
                    平均成交额分析 <small class="text-body-secondary fw-normal">按计算基准日期分段计算</small>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered align-middle text-center volatility-comparison">
                        <thead class="table-light">
                            <tr>
                                <th>指标</th>
                                <th>第1年</th>
                                <th>第2年</th>
                                <th>第3年</th>
                                <th>第4年</th>
                                <th>第5年</th>
                                <th>第6年</th>
                                <th>第7年</th>
                                <th>总体</th>
                            </tr>
                        </thead>
                        <tbody id="average-turnover-comparison-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white border-0 py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <span class="fw-semibold">
                    <i class="bi bi-bar-chart text-primary me-2"></i>K线数据
                    <small class="text-body-secondary fw-normal ms-2" id="table-meta" hidden></small>
                </span>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <input
                        id="export-file-name"
                        type="text"
                        class="form-control form-control-sm export-file-name"
                        placeholder="自定义导出文件名"
                        aria-label="导出文件名"
                    />
                    <label class="d-flex align-items-center gap-1 small mb-0">
                        导出日期
                        <select id="export-date-order" class="form-select form-select-sm" aria-label="导出日期排序">
                            <option value="asc" selected>日期升序</option>
                            <option value="desc">日期降序</option>
                        </select>
                    </label>
                    <button id="kline-chart-btn" type="button" class="btn btn-sm btn-outline-primary" disabled>
                        <i class="bi bi-graph-up me-1"></i>K线图
                    </button>
                    <button id="export-btn" type="button" class="btn btn-sm btn-outline-secondary" disabled>
                        <i class="bi bi-download me-1"></i>导出Excel
                    </button>
                </div>
            </div>
            <div class="card-body pt-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle text-end kline-table">
                        <thead class="table-light">
                            <tr id="kline-table-head"></tr>
                        </thead>
                        <tbody id="kline-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="kline-chart-modal" tabindex="-1" aria-labelledby="kline-chart-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered kline-chart-dialog">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h5 class="modal-title fs-6" id="kline-chart-modal-title">K线图</h5>
                    <div class="d-flex align-items-center gap-2 ms-3">
                        <label class="small mb-0">副图指标</label>
                        <select id="kline-chart-indicator" class="form-select form-select-sm">
                            <option value="VOL" selected>VOL</option>
                            <option value="MACD">MACD</option>
                            <option value="KDJ">KDJ</option>
                            <option value="RSI">RSI</option>
                            <option value="BOLL">BOLL</option>
                            <option value="">无</option>
                        </select>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body p-2">
                    <div id="kline-chart-container" class="kline-chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/klinecharts-10.0.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="/static/eastmoney-kline/js/excelExport.js"></script>
    <script src="/static/js/pages/eastmoney_kline_index.js"></script>
</body>
</html>

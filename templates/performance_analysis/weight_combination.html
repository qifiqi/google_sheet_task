<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权重组合分析 - Jaspil 任务管理系统</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">

    <!-- Tabulator CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">

    <script src="/static/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Tabulator 深色模式适配 */
        html[data-bs-theme="dark"] .tabulator {
            background-color: #182132;
            color: #e5e7eb;
            border-color: #2a3648;
        }
        html[data-bs-theme="dark"] .tabulator .tabulator-header {
            background-color: #1f2937;
            border-bottom-color: #334155;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .tabulator .tabulator-header .tabulator-col {
            background-color: #1f2937;
            border-right-color: #334155;
        }
        html[data-bs-theme="dark"] .tabulator .tabulator-tableholder .tabulator-table .tabulator-row {
            background-color: #182132;
            border-bottom-color: #334155;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .tabulator .tabulator-tableholder .tabulator-table .tabulator-row:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        html[data-bs-theme="dark"] .tabulator .tabulator-tableholder .tabulator-table .tabulator-row.tabulator-row-even {
            background-color: #111827;
        }

        #results-table {
            min-height: 400px;
        }
    </style>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">权重组合分析</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <a class="btn btn-sm btn-outline-secondary" href="/performance_analysis/">
                                <i class="bi bi-arrow-left"></i> 返回
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body p-3">
                        <h5 class="card-title mb-3">参数配置</h5>
                        <form id="weight-combination-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="task-id" class="form-label">任务 ID <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="task-id" required placeholder="输入任务 ID">
                                    <div class="form-text">必填项，用于获取任务中的股票收益序列</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="step" class="form-label">权重步长 (%)</label>
                                    <input type="number" class="form-control" id="step" value="5" min="1" max="100">
                                    <div class="form-text">所有权重值必须是它的整数倍，默认 5%</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="max-weight" class="form-label">组合总权重上限 (%)</label>
                                    <input type="number" class="form-control" id="max-weight" value="100" min="1" max="100">
                                    <div class="form-text">所有股票权重之和不得超过此值，默认 100%</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="min-weight" class="form-label">组合总权重下限 (%)</label>
                                    <input type="number" class="form-control" id="min-weight" value="50" min="0" max="100">
                                    <div class="form-text">避免生成大量接近空仓的组合，默认 50%</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="single-cap" class="form-label">单只股票权重上限 (%)</label>
                                    <input type="number" class="form-control" id="single-cap" value="30" min="1" max="100">
                                    <div class="form-text">防止组合过度集中在某一只，默认 30%</div>
                                </div>

                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary" id="btn-analyze">
                                        <i class="bi bi-lightning-charge-fill me-1"></i>开始分析
                                    </button>
                                    <button type="button" class="btn btn-danger" id="btn-cancel" style="display: none;">
                                        <i class="bi bi-x-circle me-1"></i>取消分析
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-3" id="progress-card" style="display: none;">
                    <div class="card-body">
                        <h6 class="card-title">分析进度</h6>
                        <div class="progress mb-2" style="height: 25px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar"
                                 role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                        </div>
                        <div class="progress-info text-muted" id="progress-info">准备中...</div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-4" id="results-card" style="display: none;">
                    <div class="card-header bg-body-tertiary border-0 py-2">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-table"></i> 组合分析结果
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="results-table"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>

    <!-- Tabulator JS -->
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
    <script src="/static/js/pages/weight_combination_tabulator.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权重组合分析 - Jaspil 任务管理系统</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <link href="/static/css/pages/weight_combination.css" rel="stylesheet">

    <!-- Tabulator CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">

    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">权重组合分析</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <a class="btn btn-sm btn-outline-secondary" href="/performance_analysis/">
                                <i class="bi bi-arrow-left"></i> 返回
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body p-3">
                        <h5 class="card-title mb-3">参数配置</h5>
                        <form id="weight-combination-form">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-3">
                                    <label for="task-id" class="form-label small">任务 ID <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-sm" id="task-id" required placeholder="输入任务 ID">
                                </div>

                                <div class="col-md">
                                    <label for="step" class="form-label small">步长(%)</label>
                                    <input type="number" class="form-control form-control-sm" id="step" value="5" min="1" max="100">
                                </div>

                                <div class="col-md">
                                    <label for="max-weight" class="form-label small">上限(%)</label>
                                    <input type="number" class="form-control form-control-sm" id="max-weight" value="100" min="1" max="100">
                                </div>

                                <div class="col-md">
                                    <label for="min-weight" class="form-label small">下限(%)</label>
                                    <input type="number" class="form-control form-control-sm" id="min-weight" value="50" min="0" max="100">
                                </div>

                                <div class="col-md">
                                    <label for="single-cap" class="form-label small">单股上限(%)</label>
                                    <input type="number" class="form-control form-control-sm" id="single-cap" value="30" min="1" max="100">
                                </div>

                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary btn-sm" id="btn-analyze">
                                        <i class="bi bi-lightning-charge-fill me-1"></i>开始分析
                                    </button>
                                </div>

                                <div class="col-auto">
                                    <button type="button" class="btn btn-danger btn-sm" id="btn-cancel" style="display: none;">
                                        <i class="bi bi-x-circle me-1"></i>取消
                                    </button>
                                </div>
                            </div>
                        </form>

                        <!-- 产品选择 + 单股范围：填好任务 ID 后自动加载，按 result_id 回传勾选与范围 -->
                        <div class="wc-products" id="products-panel" style="display: none;">
                            <div class="wc-products__toolbar">
                                <div class="form-check form-check-inline mb-0 me-2">
                                    <input class="form-check-input" type="checkbox" id="products-select-all">
                                    <label class="form-check-label small" for="products-select-all">全选</label>
                                </div>
                                <span class="wc-products__summary small text-muted" id="products-summary">已选 0 / 共 0</span>
                                <div class="wc-products__actions ms-auto">
                                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-reset-ranges"
                                            title="按任务配置的比例重新生成 0 ~ 比例 的默认范围">
                                        <i class="bi bi-arrow-counterclockwise me-1"></i>重置范围
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-reload-products">
                                        <i class="bi bi-arrow-clockwise me-1"></i>重新加载
                                    </button>
                                </div>
                            </div>
                            <p class="wc-products__hint small text-muted mb-2">
                                勾选本次参与组合的产品，并设置单股权重范围（默认 0 ~ 任务配置比例，按步长
                                <span id="products-step-hint">5</span>% 向下取整；配置比例为 0 的产品默认不勾选）；
                                范围须为步长整数倍，启用单股范围后上方「单股上限」不再生效。
                            </p>
                            <div class="wc-products__message small" id="products-message" style="display: none;"></div>
                            <div class="wc-products__table-wrap" id="products-table-wrap">
                                <table class="table table-sm align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th scope="col" class="wc-products__col-select">选</th>
                                            <th scope="col">产品</th>
                                            <th scope="col" class="wc-products__col-ratio">配置比例</th>
                                            <th scope="col" class="wc-products__col-range">单股下限(%)</th>
                                            <th scope="col" class="wc-products__col-range">单股上限(%)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="products-tbody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-3" id="progress-card" style="display: none;">
                    <div class="card-body">
                        <h6 class="card-title">分析进度</h6>
                        <div class="progress mb-2" style="height: 25px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar"
                                 role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                        </div>
                        <div class="progress-info text-muted" id="progress-info">准备中...</div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-4" id="results-card" style="display: none;">
                    <div class="card-header bg-body-tertiary border-0 py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-table"></i> 组合分析结果
                                </h5>
                                <div id="table-stats" class="mt-1 small text-muted">
                                    <span class="badge bg-success me-2" id="filtered-count">0 条显示</span>
                                    <span class="badge bg-primary" id="total-count">0 条总计</span>
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-success me-2" id="export-csv-btn">
                                    <i class="bi bi-filetype-csv me-1"></i>导出 CSV
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" id="clear-filter-btn">
                                    <i class="bi bi-x-circle me-1"></i>清除筛选
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="results-table"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>

    <!-- Tabulator JS -->
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
    <script src="/static/js/pages/weight_combination_tabulator.js"></script>
</body>
</html>

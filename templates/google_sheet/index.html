<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - Google Sheet</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">

    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div data-navbar></div>

    <div class="container mt-4" data-template-main-content>
<div class="row">
    <div class="col-md-12">
        <!-- 头部区域 - 合并统计和创建按钮 -->
        <div class="card border-0 shadow-lg mb-4 overflow-hidden position-relative">
            <!-- 背景渐变 -->
            <div class="bg-gradient-primary position-absolute top-0 start-0 w-100 h-100 opacity-5"></div>

            <div class="card-body p-0">
                <!-- 标题和按钮区域 -->
                <div class="position-relative p-4">
                    <div class="row align-items-center">
                        <!-- 左侧：标题和描述 -->
                        <div class="col-lg-4 mb-4 mb-lg-0">
                            <h3 class="text-primary fw-bold mb-2"></h3>
                        </div>

                        <!-- 右侧：创建按钮 -->
                        <div class="col-lg-8 text-lg-end">
                            <a href="/google-sheet/merge-export"
                               class="btn btn-outline-success btn-lg px-4 shadow-sm me-2">
                                <i class="bi bi-files me-2"></i>合并导出
                            </a>
                            <a href="/google-sheet/create?version=c31"
                               class="btn btn-outline-primary btn-lg px-4 shadow-sm me-2">
                                <i class="bi bi-collection-play me-2"></i>创建批量任务
                            </a>
                            <a href="/google-sheet/create"
                               class="btn btn-primary btn-lg px-4 shadow-sm">
                                <i class="bi bi-plus-circle me-2"></i>创建新任务
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 统计卡片区域 -->
                <div class="position-relative p-4 pt-0">
                    <div class="row g-3">
                        <!-- 总任务数卡片 -->
                        <div class="col-xl-3 col-md-6" id="total-tasks-card">
                            <div class="card border-0 shadow-sm h-100 bg-white bg-opacity-90">
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="text-uppercase text-muted mb-0 fs-xs">总任务数</h6>
                                        <i class="bi bi-list-task text-primary"></i>
                                    </div>
                                    <h3 class="fw-bold mb-2" id="total-tasks">0</h3>
                                    <div class="progress" style="height: 3px;">
                                        <div class="progress-bar bg-primary" style="width: 85%"></div>
                                    </div>
                                    <small class="text-muted mt-2 d-block fs-xs">今日新增: <span id="today-new">0</span></small>
                                </div>
                            </div>
                        </div>

                        <!-- 已完成卡片 -->
                        <div class="col-xl-3 col-md-6" id="completed-tasks-card">
                            <div class="card border-0 shadow-sm h-100 bg-white bg-opacity-90">
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="text-uppercase text-muted mb-0 fs-xs">已完成</h6>
                                        <i class="bi bi-check-circle text-success"></i>
                                    </div>
                                    <h3 class="fw-bold mb-2" id="completed-tasks">0</h3>
                                    <div class="progress" style="height: 3px;">
                                        <div class="progress-bar bg-success" style="width: 92%"></div>
                                    </div>
                                    <small class="text-muted mt-2 d-block fs-xs">成功率: <span
                                            id="success-rate">0%</span></small>
                                </div>
                            </div>
                        </div>

                        <!-- 执行中卡片 -->
                        <div class="col-xl-3 col-md-6" id="running-tasks-card">
                            <div class="card border-0 shadow-sm h-100 bg-white bg-opacity-90">
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="text-uppercase text-muted mb-0 fs-xs">执行中</h6>
                                        <i class="bi bi-play-circle text-warning"></i>
                                    </div>
                                    <h3 class="fw-bold mb-2" id="running-tasks">0</h3>
                                    <div class="progress" style="height: 3px;">
                                        <div class="progress-bar bg-warning" style="width: 65%"></div>
                                    </div>
                                    <small class="text-muted mt-2 d-block fs-xs">平均时长: <span
                                            id="avg-duration">0m</span></small>
                                </div>
                            </div>
                        </div>

                        <!-- 执行出错卡片 -->
                        <div class="col-xl-3 col-md-6" id="error-tasks-card">
                            <div class="card border-0 shadow-sm h-100 bg-white bg-opacity-90">
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="text-uppercase text-muted mb-0 fs-xs">执行出错</h6>
                                        <i class="bi bi-exclamation-triangle text-danger"></i>
                                    </div>
                                    <h3 class="fw-bold mb-2" id="error-tasks">0</h3>
                                    <div class="progress" style="height: 3px;">
                                        <div class="progress-bar bg-danger" style="width: 18%"></div>
                                    </div>
                                    <small class="text-muted mt-2 d-block fs-xs">错误率: <span id="error-rate">0%</span></small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 待重启任务提示 -->
        <div class="alert alert-warning alert-dismissible fade show d-none" id="pending-tasks-alert">
            <div class="d-flex align-items-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div class="flex-grow-1">
                    <strong>发现待重启的任务!</strong>
                    <span id="pending-tasks-message"></span>
                </div>
                <button type="button" class="btn btn-outline-warning btn-sm me-2" onclick="checkAllPendingTasks()">
                    <i class="bi bi-search"></i> 查看详情
                </button>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- 任务列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="text-primary fw-bold mb-2">任务列表</h4>

                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="refreshTasks()">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                    <select class="form-select form-select-sm w-auto" id="filter-select" onchange="filterTasks(this.value)">
                        <option value="all">全部任务</option>
                        <option value="running">执行中</option>
                        <option value="completed">已完成</option>
                        <option value="error">执行出错</option>
                        <option value="cancelled">已取消</option>
                        <option value="pending">待重启</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-hover" id="tasks-table">
                        <thead>
                        <tr class="table-light">
                            <th class="ps-3 py-2 border-bottom">任务名称</th>
                            <th class="py-2 border-bottom">状态</th>
                            <th class="py-2 border-bottom">进度</th>
                            <th class="py-2 border-bottom">开始时间</th>
                            <th class="py-2 border-bottom">结束时间</th>
                            <th class="pe-3 py-2 border-bottom">操作</th>
                        </tr>
                        </thead>
                        <tbody id="tasks-table-body">
                        <!-- 任务列表将通过JavaScript动态填充 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页控件 - 单行布局 -->
                <div class="d-flex justify-content-center align-items-center flex-wrap gap-4 mt-4 py-3">
                    <!-- 显示信息 -->
                    <span class="text-muted" id="pagination-info">
                        显示第 1-10 条，共 0 条记录
                    </span>

                    <!-- 分页导航 -->
                    <nav aria-label="任务分页">
                        <ul class="pagination pagination-sm mb-0" id="pagination">
                            <!-- 分页按钮将通过JavaScript动态生成 -->
                        </ul>
                    </nav>

                    <!-- 每页显示数量 -->
                    <div class="d-flex align-items-center">
                        <label class="form-label me-2 mb-0 text-muted">每页显示:</label>
                        <select class="form-select form-select-sm w-auto" id="page-size-select" onchange="changePageSize()">
                            <option value="5">5条</option>
                            <option value="10" selected>10条</option>
                            <option value="20">20条</option>
                            <option value="50">50条</option>
                            <option value="100">100条</option>
                        </select>
                    </div>

                    <!-- 快速跳转 -->
                    <div class="d-flex align-items-center">
                        <span class="text-muted me-2">跳转到:</span>
                        <input type="number" class="form-control form-control-sm" id="page-jump-input"
                               style="width: 60px;" min="1" placeholder="页">
                        <button class="btn btn-outline-secondary btn-sm ms-1" onclick="jumpToPage()">
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/google_sheet_index.js"></script>
</body>
</html>

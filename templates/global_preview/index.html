<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局预览中心</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <link href="/static/css/pages/global_preview_index.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="container-fluid py-4 preview-hub">
    <div class="card shadow-sm preview-toolbar">
        <div class="card-body p-3">
            <form class="row g-2" id="queryForm">
                <div class="col-md-5">
                    <input class="form-control" id="taskIdInput" autocomplete="off" placeholder="任务 ID">
                </div>
                <div class="col-md-4">
                    <input class="form-control" id="exportNameInput" autocomplete="off" placeholder="导出文件名">
                </div>
                <div class="col-md-auto d-flex gap-2">
                    <button class="btn btn-primary px-4" type="submit">查询</button>
                    <button class="btn btn-outline-success" id="exportBtn" type="button" disabled>
                        <i class="bi bi-file-earmark-arrow-down me-1"></i>导出
                    </button>
                    <button class="btn btn-outline-primary" id="exportWordBtn" type="button" disabled>
                        <i class="bi bi-file-earmark-word me-1"></i>导出Word
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="alert d-none mb-0" id="messageBox" role="alert"></div>

    <div class="card shadow-sm d-none" id="loadingCard">
        <div class="card-body preview-loading"><div class="spinner-border text-primary" role="status"></div><div class="text-body-secondary" id="loadingText">正在加载…</div></div>
    </div>

    <div class="card shadow-sm d-none" id="filterCard">
        <div class="card-body p-3">
            <div class="row g-3">
                <div class="col-md-4" id="stockSelectWrap"><label class="form-label small text-body-secondary" for="stockSelect">股票代码</label><select class="form-select" id="stockSelect"></select></div>
                <div class="col-md-4"><label class="form-label small text-body-secondary" for="yearSelect">年份分组</label><select class="form-select" id="yearSelect"></select></div>
                <div class="col-md-4 d-flex align-items-end"><div class="small text-body-secondary pb-2" id="groupMeta"></div></div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm d-none" id="previewCard"><div class="card-body p-0"><div class="preview-table-wrap" id="previewContainer"></div></div></div>

    <div class="modal fade word-export-modal" id="wordExportModal" tabindex="-1" aria-labelledby="wordExportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content shadow">
                <div class="modal-header bg-body-tertiary border-0 px-4 py-3">
                    <div>
                        <h5 class="modal-title fw-bold" id="wordExportModalLabel">导出 Word 报告</h5>
                        <div class="small text-body-secondary mt-1">每个结果（股票×年份×参数方案）一个 RPT-S 文档，勾选后逐个导出下载。</div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 border rounded-1 p-3 mb-3 bg-body-tertiary">
                        <div class="fw-semibold" id="wordExportSummary">共 0 个结果，可导出 0 个，已选 0 个</div>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="btn btn-sm btn-light border" id="wordExportSelectAllBtn">全选可导出</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="wordExportClearBtn">清空</button>
                        </div>
                    </div>
                    <div class="d-flex flex-column gap-2" id="wordExportResultList"></div>
                </div>
                <div class="modal-footer bg-body-tertiary border-0 px-4 py-3">
                    <div class="me-auto small text-body-secondary">相邻导出间隔 2 秒；单个失败不中断，结束后汇总。</div>
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-success rounded-pill px-4" id="confirmWordExportBtn" disabled>
                        <i class="bi bi-file-earmark-word me-1"></i>导出已选 <span id="wordExportSelectedCount">0</span> 个
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
    <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/pages/global_preview_index.js"></script>
</body>
</html>

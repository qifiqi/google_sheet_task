    <style>
        :root {
            --bs-secondary-color: rgba(33, 37, 41, 0.75);
            --bs-tertiary-bg: #f8f9fa;
            --bs-emphasis-color: #000;
        }
        html[data-bs-theme="dark"] {
            --bs-body-color: #e5e7eb;
            --bs-body-bg: #111827;
            --bs-border-color: #334155;
            --bs-secondary-color: #94a3b8;
            --bs-tertiary-bg: #1f2937;
            --bs-emphasis-color: #f8fafc;
        }
        .text-body {
            color: var(--bs-body-color) !important;
        }
        .text-body-secondary {
            color: var(--bs-secondary-color) !important;
        }
        .bg-body {
            background-color: var(--bs-body-bg) !important;
        }
        .bg-body-tertiary {
            background-color: var(--bs-tertiary-bg) !important;
        }
        body {
            background-color: #f8f9fa;
        }
        html[data-bs-theme="dark"] body {
            background-color: #111827;
            color: #e5e7eb;
        }
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            overflow-y: scroll;
            overflow-x: hidden;
            border-right: 1px solid #e9ecef;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.04);
            scrollbar-gutter: stable;
            flex: 0 0 auto;
        }
        html[data-bs-theme="dark"] .sidebar {
            background: #111827;
            border-right-color: #243041;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.04);
        }
        .sidebar-brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, #0d6efd 0%, #4dabf7 100%);
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.18);
        }
        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #495057;
            padding: 0.65rem 0.85rem;
            border-radius: 0.75rem;
            margin-bottom: 0.2rem;
            font-weight: 500;
            transition: all 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link {
            color: #d1d5db;
        }
        .sidebar .nav-link:hover {
            color: #0d6efd;
            background-color: #f1f5ff;
        }
        html[data-bs-theme="dark"] .sidebar .nav-link:hover {
            color: #93c5fd;
            background-color: rgba(59, 130, 246, 0.14);
        }
        .sidebar .nav-link.active {
            color: #0d6efd;
            background-color: #e7f1ff;
            box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.12);
        }
        html[data-bs-theme="dark"] .sidebar .nav-link.active {
            color: #bfdbfe;
            background-color: rgba(59, 130, 246, 0.18);
            box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.2);
        }
        .sidebar .btn-toggle {
            width: 100%;
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #343a40;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.8rem 0.85rem 0.55rem;
            border-radius: 0.75rem;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle {
            color: #e5e7eb;
        }
        .sidebar .btn-toggle:hover {
            background: #f8f9fa;
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #93c5fd;
        }
        .sidebar .btn-toggle-icon {
            transition: transform 0.2s ease;
            color: #868e96;
            font-size: 0.9rem;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle-icon {
            color: #94a3b8;
        }
        .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            transform: rotate(90deg);
            color: #0d6efd;
        }
        html[data-bs-theme="dark"] .sidebar .btn-toggle[aria-expanded="true"] .btn-toggle-icon {
            color: #93c5fd;
        }
        .sidebar .btn-toggle-nav {
            padding-left: 0;
            margin: 0.1rem 0 0;
            list-style: none;
            padding-left: 0.15rem;
        }
        .sidebar .btn-toggle-nav li {
            margin: 0;
        }
        .sidebar .btn-toggle-nav .nav-link {
            margin-left: 0.25rem;
            padding: 0.48rem 0.75rem 0.48rem 0.85rem;
            white-space: nowrap;
            font-size: 0.93rem;
            font-weight: 500;
            border-radius: 0.7rem;
        }
        .sidebar .btn-toggle-nav .nav-link i {
            font-size: 0.92rem;
            opacity: 0.9;
        }
        .sidebar .btn-toggle-nav .nav-link span {
            font-size: 0.93rem;
        }
        .main-content {
            min-width: 0;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 1000;
                width: 25%;
                max-width: 25%;
            }
            .main-content {
                margin-left: 25%;
            }
        }

        @media (min-width: 992px) {
            .sidebar {
                width: 16.666667%;
                max-width: 16.666667%;
            }
            .main-content {
                margin-left: 16.666667%;
            }
        }
        .sidebar::-webkit-scrollbar {
            width: 10px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #ced4da;
            border-radius: 999px;
            border: 2px solid #ffffff;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #adb5bd;
        }
        .sidebar-user-avatar {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #fb7185 0%, #8b5cf6 100%);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.18);
            flex-shrink: 0;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        html[data-bs-theme="dark"] .card {
            background-color: #182132;
            border-color: #2a3648;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table {
            --bs-table-color: #e5e7eb;
            --bs-table-bg: transparent;
            --bs-table-border-color: #334155;
            --bs-table-striped-color: #e5e7eb;
            --bs-table-striped-bg: rgba(148, 163, 184, 0.05);
            --bs-table-active-color: #f8fafc;
            --bs-table-active-bg: rgba(59, 130, 246, 0.12);
            --bs-table-hover-color: #f8fafc;
            --bs-table-hover-bg: rgba(59, 130, 246, 0.08);
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .table > :not(caption) > * > * {
            color: inherit;
        }
        html[data-bs-theme="dark"] .table thead,
        html[data-bs-theme="dark"] .table-light,
        html[data-bs-theme="dark"] .bg-white {
            background-color: #182132 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .table-light > :not(caption) > * > *,
        html[data-bs-theme="dark"] .table > thead > tr > th {
            background-color: #182132 !important;
            color: #e5e7eb !important;
            border-bottom-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .table code {
            color: #f9a8d4;
        }
        html[data-bs-theme="dark"] .table .text-dark {
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .bg-light,
        html[data-bs-theme="dark"] .alert-light {
            background-color: #1f2937 !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .dropdown-menu {
            background-color: #182132;
            border-color: #2a3648;
        }
        html[data-bs-theme="dark"] .dropdown-item {
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .dropdown-item:hover,
        html[data-bs-theme="dark"] .dropdown-item:focus {
            color: #f8fafc;
            background-color: rgba(59, 130, 246, 0.12);
        }
        html[data-bs-theme="dark"] .dropdown-divider {
            border-top-color: #334155;
        }
        html[data-bs-theme="dark"] .text-muted {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .form-control,
        html[data-bs-theme="dark"] .form-select,
        html[data-bs-theme="dark"] .input-group-text,
        html[data-bs-theme="dark"] textarea.form-control {
            background-color: #111827 !important;
            border-color: #334155 !important;
            color: #e5e7eb !important;
        }
        html[data-bs-theme="dark"] .form-control:focus,
        html[data-bs-theme="dark"] .form-select:focus,
        html[data-bs-theme="dark"] textarea.form-control:focus {
            background-color: #0f172a !important;
            border-color: #3b82f6 !important;
            color: #f8fafc !important;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.18) !important;
        }
        html[data-bs-theme="dark"] .form-control::placeholder,
        html[data-bs-theme="dark"] textarea.form-control::placeholder {
            color: #7c8aa0 !important;
        }
        html[data-bs-theme="dark"] .form-select option {
            background-color: #111827;
            color: #e5e7eb;
        }
        html[data-bs-theme="dark"] .input-group-text {
            color: #94a3b8 !important;
        }
        html[data-bs-theme="dark"] .text-bg-light,
        html[data-bs-theme="dark"] .badge.text-bg-light {
            background-color: #1e293b !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
        }
        html[data-bs-theme="dark"] .list-group-item {
            background-color: #111827;
            color: #e5e7eb;
            border-color: #334155;
        }
        html[data-bs-theme="dark"] .list-group-item.active {
            background-color: rgba(59, 130, 246, 0.18);
            border-color: #3b82f6;
            color: #f8fafc;
        }
        html[data-bs-theme="dark"] .card-header.border-0 {
            border-bottom: 1px solid rgba(148, 163, 184, 0.12) !important;
        }
        .log-container {
            height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            border-radius: 0.375rem;
            font-size: 14px;
            white-space: pre;
            word-break: normal;
        }
    </style>

<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">定时任务管理</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            <i class="bi bi-plus-circle"></i> 添加定时任务
        </button>
    </div>

<!-- 任务统计卡片 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-bg-primary border-0 h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">总任务数</h6>
                        <h3 id="totalTasks">0</h3>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-list-task fs-2"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-success border-0 h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">活跃任务</h6>
                        <h3 id="activeTasks">0</h3>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-play-circle fs-2"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-warning border-0 h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">暂停任务</h6>
                        <h3 id="inactiveTasks">0</h3>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-pause-circle fs-2"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-info border-0 h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">调度器状态</h6>
                        <h3 id="schedulerStatus">未知</h3>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-gear fs-2"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 定时任务列表 -->
<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">定时任务列表</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="tasksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>任务名称</th>
                        <th>描述</th>
                        <th>Cron表达式</th>
                        <th>任务类型</th>
                        <th>状态</th>
                        <th>执行次数</th>
                        <th>上次执行</th>
                        <th>下次执行</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 数据通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 添加任务模态框 -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加定时任务</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addTaskForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="taskName" class="form-label">任务名称 *</label>
                                <input type="text" class="form-control" id="taskName" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="taskType" class="form-label">任务类型 *</label>
                                <select class="form-select" id="taskType" required>
                                    <option value="">请选择任务类型</option>
                                    <option value="cleanup">数据清理</option>
                                    <option value="backup">数据备份</option>
                                    <option value="maintenance">系统维护</option>
                                    <option value="custom">自定义</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">任务描述</label>
                        <textarea class="form-control" id="taskDescription" rows="2"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="cronExpression" class="form-label">Cron表达式 *</label>
                                <input type="text" class="form-control" id="cronExpression" required 
                                       placeholder="例: 0 0 * * * (每天0点)">
                                <div class="form-text">
                                    格式: 分 时 日 月 周<br>
                                    例: 0 0 * * * (每天0点), 0 */6 * * * (每6小时)
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="taskFunction" class="form-label">执行函数 *</label>
                                <select class="form-select" id="taskFunction" required>
                                    <option value="">请选择执行函数</option>
                                    <option value="cleanup_old_logs">清理旧日志</option>
                                    <option value="cleanup_old_results">清理旧结果</option>
                                    <option value="cleanup_old_data">清理旧数据</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="taskParams" class="form-label">任务参数 (JSON格式)</label>
                        <textarea class="form-control" id="taskParams" rows="3" 
                                  placeholder='{"days": 10}'></textarea>
                        <div class="form-text">
                            JSON格式的参数，例: {"days": 10} 表示清理10天前的数据
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="isActive" checked>
                            <label class="form-check-label" for="isActive">
                                启用任务
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addTask()">添加任务</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑任务模态框 -->
<div class="modal fade" id="editTaskModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑定时任务</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <input type="hidden" id="editTaskId">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="editTaskName" class="form-label">任务名称 *</label>
                                <input type="text" class="form-control" id="editTaskName" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="editTaskType" class="form-label">任务类型 *</label>
                                <select class="form-select" id="editTaskType" required>
                                    <option value="cleanup">数据清理</option>
                                    <option value="backup">数据备份</option>
                                    <option value="maintenance">系统维护</option>
                                    <option value="custom">自定义</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="editTaskDescription" class="form-label">任务描述</label>
                        <textarea class="form-control" id="editTaskDescription" rows="2"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="editCronExpression" class="form-label">Cron表达式 *</label>
                                <input type="text" class="form-control" id="editCronExpression" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="editTaskFunction" class="form-label">执行函数 *</label>
                                <select class="form-select" id="editTaskFunction" required>
                                    <option value="cleanup_old_logs">清理旧日志</option>
                                    <option value="cleanup_old_results">清理旧结果</option>
                                    <option value="cleanup_old_data">清理旧数据</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="editTaskParams" class="form-label">任务参数 (JSON格式)</label>
                        <textarea class="form-control" id="editTaskParams" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="editIsActive">
                            <label class="form-check-label" for="editIsActive">
                                启用任务
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="updateTask()">更新任务</button>
            </div>
        </div>
    </div>
</div>

            </main>
        </div>
    </div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaspil 任务管理系统</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <link href="/static/css/pages/admin_results.css" rel="stylesheet">
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="container-fluid">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">任务结果管理</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <div class="input-group me-2">
                <input type="text" class="form-control" id="taskIdFilter" placeholder="输入任务ID筛选">
                <button class="btn btn-outline-secondary" type="button" id="filterButton">
                    <i class="bi bi-search"></i> 筛选
                </button>
            </div>
        </div>
    </div>

    <!-- 结果列表 -->
    <div class="table-responsive">
        <table class="table table-striped table-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>任务ID</th>
                    <th>步骤索引</th>
                    <th>状态</th>
                    <th>时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="resultList">
                <!-- 结果列表将通过JavaScript动态加载 -->
            </tbody>
        </table>
    </div>

    <!-- 分页控件 -->
    <div class="d-flex justify-content-between align-items-center flex-wrap mt-3">
        <div class="d-flex align-items-center">
            <span class="text-muted me-2">显示</span>
            <select class="form-select form-select-sm me-2 w-auto" id="page-size-select" onchange="changePageSize()">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span class="text-muted">条/页</span>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0" id="pagination">
                <!-- 分页将通过JavaScript动态加载 -->
            </ul>
        </nav>
    </div>
</div>

<!-- 查看结果详情模态框 -->
<div class="modal fade" id="viewResultModal" tabindex="-1" aria-labelledby="viewResultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="viewResultModalLabel">结果详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="result-meta-grid mb-3">
                    <div class="result-meta-item">
                        <div class="small text-muted">结果 ID</div>
                        <div class="fw-semibold" id="resultDetailId">-</div>
                    </div>
                    <div class="result-meta-item">
                        <div class="small text-muted">任务 ID</div>
                        <div class="fw-semibold text-break" id="resultDetailTaskId">-</div>
                    </div>
                    <div class="result-meta-item">
                        <div class="small text-muted">步骤索引</div>
                        <div class="fw-semibold" id="resultDetailStep">-</div>
                    </div>
                    <div class="result-meta-item">
                        <div class="small text-muted">状态 / 时间</div>
                        <div class="fw-semibold" id="resultDetailStatus">-</div>
                    </div>
                </div>

                <ul class="nav nav-tabs" id="resultJsonTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="result-params-tab" data-bs-toggle="tab" data-bs-target="#result-params-pane" type="button" role="tab">
                            参数 JSON
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="result-data-tab" data-bs-toggle="tab" data-bs-target="#result-data-pane" type="button" role="tab">
                            结果 JSON
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="result-error-tab" data-bs-toggle="tab" data-bs-target="#result-error-pane" type="button" role="tab">
                            错误信息
                        </button>
                    </li>
                </ul>
                <div class="tab-content border border-top-0 rounded-bottom p-3">
                    <div class="tab-pane fade show active" id="result-params-pane" role="tabpanel" tabindex="0">
                        <pre id="resultParameters" class="json-viewer bg-body-tertiary p-3 rounded mb-0"></pre>
                    </div>
                    <div class="tab-pane fade" id="result-data-pane" role="tabpanel" tabindex="0">
                        <pre id="resultData" class="json-viewer bg-body-tertiary p-3 rounded mb-0"></pre>
                    </div>
                    <div class="tab-pane fade" id="result-error-pane" role="tabpanel" tabindex="0">
                        <pre id="errorMessage" class="json-viewer bg-body-tertiary p-3 rounded text-danger mb-0"></pre>
                    </div>
                </div>
                <div class="d-flex justify-content-end mt-3">
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="copyCurrentResultJson()">
                        <i class="bi bi-clipboard"></i> 复制当前 JSON
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
        <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
<script src="/static/js/pages/admin_results.js"></script>
</body>
</html>

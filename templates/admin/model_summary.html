<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单模型汇总数据看板</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="model-summary-hero">
    <div>
        <h1 class="h3 mb-1">单模型汇总数据看板</h1>
        <div class="text-muted">按历史任务结果汇总 C3、C5、回测最优参数结果</div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" id="refreshBtn">
            <i class="bi bi-arrow-clockwise"></i>
            刷新
        </button>
        <button class="btn btn-outline-success" id="exportCsvBtn">
            <i class="bi bi-file-earmark-spreadsheet"></i>
            导出 CSV
        </button>
        <button class="btn btn-primary" id="rebuildBtn">
            <i class="bi bi-database-fill-gear"></i>
            重建索引
        </button>
    </div>
</div>

<div class="summary-card-grid option-one mb-3">
    <div class="summary-market-card">
        <div class="summary-card-title">市场结构</div>
        <div class="summary-main-row">
            <div class="summary-main-number" id="summaryStockCount">0</div>
            <div class="summary-main-label">股票总数</div>
        </div>
        <div class="market-share-bar" aria-hidden="true">
            <div class="market-share-cn" id="summaryCnShareBar"></div>
            <div class="market-share-us" id="summaryUsShareBar"></div>
        </div>
        <div class="market-inline-row">
            <div class="market-row">
                <span><i class="market-dot cn"></i>A股</span>
                <strong id="summaryCnStockCount">0</strong>
            </div>
            <div class="market-row">
                <span><i class="market-dot us"></i>美股</span>
                <strong id="summaryUsStockCount">0</strong>
            </div>
        </div>
        <div class="market-task-row">
            <span>任务总数</span>
            <strong id="summaryTaskCount">0</strong>
        </div>
    </div>
    <div class="return-threshold-card threshold-positive">
        <div class="return-card-title">ReturnBeats</div>
        <div class="return-card-threshold">&gt; 0%</div>
        <div class="return-card-count" id="summaryReturnGt0">0</div>
        <div class="return-progress"><span id="summaryReturnGt0Bar"></span></div>
        <div class="return-card-caption" id="summaryReturnGt0Caption">占筛选任务</div>
        <div class="return-card-rate" id="summaryReturnGt0Rate">0%</div>
    </div>
    <div class="return-threshold-card threshold-medium">
        <div class="return-card-title">ReturnBeats</div>
        <div class="return-card-threshold">&gt; 20%</div>
        <div class="return-card-count" id="summaryReturnGt20">0</div>
        <div class="return-progress"><span id="summaryReturnGt20Bar"></span></div>
        <div class="return-card-caption" id="summaryReturnGt20Caption">占筛选任务</div>
        <div class="return-card-rate" id="summaryReturnGt20Rate">0%</div>
    </div>
    <div class="return-threshold-card threshold-strong">
        <div class="return-card-title">ReturnBeats</div>
        <div class="return-card-threshold">&gt; 50%</div>
        <div class="return-card-count" id="summaryReturnGt50">0</div>
        <div class="return-progress"><span id="summaryReturnGt50Bar"></span></div>
        <div class="return-card-caption" id="summaryReturnGt50Caption">占筛选任务</div>
        <div class="return-card-rate" id="summaryReturnGt50Rate">0%</div>
    </div>
    <div class="return-threshold-card threshold-extreme">
        <div class="return-card-title">ReturnBeats</div>
        <div class="return-card-threshold">&gt; 100%</div>
        <div class="return-card-count" id="summaryReturnGt100">0</div>
        <div class="return-progress"><span id="summaryReturnGt100Bar"></span></div>
        <div class="return-card-caption" id="summaryReturnGt100Caption">占筛选任务</div>
        <div class="return-card-rate" id="summaryReturnGt100Rate">0%</div>
    </div>
</div>
<div class="d-none" id="statusText">等待查询</div>

<div class="card mb-3 model-summary-filter-card">
    <div class="card-body">
        <form class="model-summary-filter-grid" id="filterForm">
            <div class="filter-field">
                <label class="form-label">任务类型</label>
                <select class="form-select form-select-sm" id="taskType">
                    <option value="">全部</option>
                    <option value="google_sheet">C3</option>
                    <option value="google_sheet_C4">C4</option>
                    <option value="google_sheet_C5">C5</option>
                    <option value="backtest_training">回测</option>
                </select>
            </div>
            <div class="filter-field">
                <label class="form-label">股票代码</label>
                <input type="text" class="form-control form-control-sm" id="stockCode" placeholder="代码/股票名/任务名">
            </div>
            <div class="filter-field">
                <label class="form-label">市场</label>
                <select class="form-select form-select-sm" id="marketType">
                    <option value="">全部</option>
                    <option value="cn">A股</option>
                    <option value="us">美股</option>
                </select>
            </div>
            <div class="filter-field">
                <label class="form-label">结果日期范围</label>
                <div class="d-flex gap-2">
                    <input type="date" class="form-control form-control-sm" id="resultDateFrom" placeholder="开始日期">
                    <span class="align-self-center">至</span>
                    <input type="date" class="form-control form-control-sm" id="resultDateTo" placeholder="结束日期">
                </div>
            </div>
            <div class="filter-field">
                <label class="form-label">年份/区间</label>
                <select class="form-select form-select-sm" id="periodFilter">
                    <option value="">全部</option>
                    <option value="recent_1y">近1年</option>
                    <option value="recent_3y">近3年</option>
                    <option value="full_2026">整年26</option>
                    <option value="full_2025">整年25</option>
                    <option value="full_2024">整年24</option>
                    <option value="full_2023">整年23</option>
                    <option value="full_2022">整年22</option>
                    <option value="full_2021">整年21</option>
                    <option value="full_2020">整年20</option>
                    <option value="full_2019">整年19</option>
                </select>
            </div>
            <div class="filter-field task-id-field">
                <label class="form-label">任务 ID</label>
                <input type="text" class="form-control form-control-sm" id="taskId" placeholder="精确任务 ID">
            </div>
            <div class="filter-field">
                <label class="form-label">结果 ID</label>
                <input type="number" class="form-control form-control-sm" id="resultId" placeholder="结果 ID">
            </div>
            <div class="filter-field">
                <label class="form-label">汇总方式</label>
                <select class="form-select form-select-sm" id="summaryType">
                    <option value="task">任务汇总</option>
                    <option value="stock">股票汇总</option>
                </select>
            </div>
            <div class="filter-field">
                <label class="form-label">数据范围</label>
                <select class="form-select form-select-sm" id="bestOnly">
                    <option value="true">仅最优</option>
                    <option value="false">全部结果</option>
                </select>
            </div>
            <div class="filter-field">
                <label class="form-label">超额收益</label>
                <select class="form-select form-select-sm" id="excessReturnMin">
                    <option value="">全部</option>
                    <option value="0">大于 0%</option>
                    <option value="10">大于 10%</option>
                    <option value="20">大于 20%</option>
                    <option value="30">大于 30%</option>
                    <option value="50">大于 50%</option>
                    <option value="100">大于 100%</option>
                </select>
            </div>
            <div class="filter-actions">
                <button type="submit" class="btn btn-primary btn-sm" id="queryBtn">
                    <i class="bi bi-search me-1"></i>查询
                </button>
            </div>
            <div class="filter-hint">全部结果必须输入股票代码、股票名或任务名关键字；市场按股票代码纯数字识别 A股。</div>
        </form>
    </div>
</div>
<div class="small mb-2" id="rebuildTaskLink"></div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive model-summary-table-wrap">
            <table class="table table-hover table-bordered align-middle mb-0 model-summary-table">
                <thead class="table-light" id="summaryHead"></thead>
                <tbody id="summaryBody"></tbody>
            </table>
        </div>
    </div>
    <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex flex-wrap align-items-center gap-2">
            <div class="small text-muted" id="paginationText">显示 0-0 条，共 0 条任务</div>
            <select class="form-select form-select-sm pagination-size-select" id="pageSize">
                <option value="25">25 / 页</option>
                <option value="50" selected>50 / 页</option>
                <option value="100">100 / 页</option>
                <option value="200">200 / 页</option>
            </select>
        </div>
        <div class="btn-group">
            <button class="btn btn-outline-secondary btn-sm" id="prevPage">上一页</button>
            <button class="btn btn-primary btn-sm" id="currentPage" disabled>1</button>
            <button class="btn btn-outline-secondary btn-sm" id="nextPage">下一页</button>
        </div>
    </div>
</div>

<div class="modal fade" id="exportCsvModal" tabindex="-1" aria-labelledby="exportCsvModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exportCsvModalLabel">确认导出 CSV</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label" for="exportFilename">文件名</label>
                    <input type="text" class="form-control" id="exportFilename" placeholder="请输入 CSV 文件名">
                    <div class="form-text">无需输入 .csv，系统会自动补全。</div>
                </div>
                <div class="small text-muted" id="exportSummaryText"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" id="confirmExportCsvBtn">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i>确认导出
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .model-summary-hero {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
    }
    .model-summary-hero .h3 {
        font-size: 1.45rem;
    }
    .model-summary-filter-card .card-body {
        padding: 0.72rem 1rem 0.62rem;
    }
    .model-summary-filter-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.46rem 0.65rem;
        align-items: start;
    }
    .model-summary-filter-grid .form-label {
        margin-bottom: 0.25rem;
        color: var(--bs-secondary-color);
        font-size: 0.76rem;
        font-weight: 700;
    }
    .filter-actions {
        align-self: start;
        padding-top: 1.48rem;
    }
    .filter-actions .btn {
        min-height: 31px;
        width: 100%;
        white-space: nowrap;
    }
    .filter-hint {
        grid-column: 1 / -1;
        color: var(--bs-secondary-color);
        font-size: 0.78rem;
        line-height: 1.2;
    }
    .summary-card-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.55rem;
    }
    .summary-card-grid.option-one {
        align-items: stretch;
    }
    .summary-market-card,
    .return-threshold-card {
        border: 1px solid var(--bs-border-color);
        border-radius: 0.5rem;
        background: var(--bs-body-bg);
        box-shadow: 0 0.08rem 0.22rem rgba(15, 23, 42, 0.04);
    }
    .summary-market-card {
        min-height: 4.75rem;
        padding: 0.58rem 0.82rem;
        background: #f8fafc;
    }
    .summary-card-title,
    .return-card-title {
        color: var(--bs-secondary-color);
        font-size: 0.76rem;
        font-weight: 700;
    }
    .summary-main-row {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        margin-top: 0.25rem;
    }
    .summary-main-number {
        color: var(--bs-body-color);
        font-size: 1.72rem;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    .summary-main-label {
        color: var(--bs-secondary-color);
        font-size: 0.76rem;
    }
    .market-share-bar {
        display: flex;
        width: 100%;
        height: 0.36rem;
        margin: 0.38rem 0 0.35rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--bs-border-color);
    }
    .market-share-cn {
        width: 0;
        background: #22c55e;
        transition: width 0.2s ease;
    }
    .market-share-us {
        width: 0;
        background: #6366f1;
        transition: width 0.2s ease;
    }
    .market-inline-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
    }
    .market-row,
    .market-task-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.1rem 0;
        color: var(--bs-secondary-color);
        font-size: 0.76rem;
        border-bottom: 0;
    }
    .market-task-row {
        margin-top: 0.02rem;
        padding-bottom: 0;
    }
    .market-row strong,
    .market-task-row strong {
        color: var(--bs-body-color);
        font-size: 0.92rem;
        font-variant-numeric: tabular-nums;
    }
    .market-dot {
        display: inline-block;
        width: 0.46rem;
        height: 0.46rem;
        margin-right: 0.35rem;
        border-radius: 50%;
    }
    .market-dot.cn {
        background: #22c55e;
    }
    .market-dot.us {
        background: #6366f1;
    }
    .return-threshold-card {
        min-height: 4.75rem;
        padding: 0.58rem 0.72rem;
    }
    .return-card-threshold {
        margin-top: 0.06rem;
        font-size: 0.78rem;
        font-weight: 700;
    }
    .return-card-count {
        margin-top: 0.24rem;
        font-size: 1.55rem;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    .return-progress {
        height: 0.31rem;
        margin-top: 0.34rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.22);
    }
    .return-progress span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        transition: width 0.2s ease;
    }
    .return-card-caption {
        margin-top: 0.28rem;
        color: var(--bs-secondary-color);
        font-size: 0.7rem;
    }
    .return-card-rate {
        margin-top: 0.04rem;
        font-size: 0.88rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
    }
    .threshold-positive {
        background: #f0fdf4;
        border-color: #bbf7d0;
    }
    .threshold-positive .return-card-title,
    .threshold-positive .return-card-threshold,
    .threshold-positive .return-card-count,
    .threshold-positive .return-card-rate {
        color: #166534;
    }
    .threshold-positive .return-progress span {
        background: #16a34a;
    }
    .threshold-medium {
        background: #f7fee7;
        border-color: #d9f99d;
    }
    .threshold-medium .return-card-title,
    .threshold-medium .return-card-threshold,
    .threshold-medium .return-card-count,
    .threshold-medium .return-card-rate {
        color: #4d7c0f;
    }
    .threshold-medium .return-progress span {
        background: #65a30d;
    }
    .threshold-strong {
        background: #fffbeb;
        border-color: #fde68a;
    }
    .threshold-strong .return-card-title,
    .threshold-strong .return-card-threshold,
    .threshold-strong .return-card-count,
    .threshold-strong .return-card-rate {
        color: #92400e;
    }
    .threshold-strong .return-progress span {
        background: #d97706;
    }
    .threshold-extreme {
        background: #fef2f2;
        border-color: #fecaca;
    }
    .threshold-extreme .return-card-title,
    .threshold-extreme .return-card-threshold,
    .threshold-extreme .return-card-count,
    .threshold-extreme .return-card-rate {
        color: #991b1b;
    }
    .threshold-extreme .return-progress span {
        background: #dc2626;
    }
    @media (min-width: 1200px) {
        .model-summary-filter-grid {
            grid-template-columns:
                minmax(0, 0.95fr)
                minmax(0, 0.95fr)
                minmax(0, 0.8fr)
                minmax(0, 2.5fr)
                minmax(0, 0.95fr)
                minmax(0, 0.95fr)
                minmax(0, 0.95fr)
                minmax(0, 0.95fr)
                minmax(0, 0.95fr)
                minmax(0, 0.7fr);
        }
        .summary-card-grid {
            grid-template-columns: minmax(20rem, 1.45fr) repeat(4, minmax(9.25rem, 1fr));
        }
    }
    @media (max-width: 575.98px) {
        .model-summary-filter-grid {
            grid-template-columns: 1fr;
        }
        .filter-actions {
            padding-top: 0;
        }
    }
    .summary-tile {
        border: 1px solid var(--bs-border-color);
        border-radius: 0.5rem;
        padding: 1rem;
        background: var(--bs-body-bg);
    }
    .pagination-size-select {
        width: auto;
        min-width: 98px;
    }
    .model-summary-table-wrap {
        max-height: calc(100vh - 300px);
        min-height: 360px;
    }
    .model-summary-table {
        min-width: 1580px;
        font-size: 0.82rem;
    }
    .model-summary-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        white-space: nowrap;
    }
    .model-summary-table td {
        white-space: nowrap;
    }
    .model-summary-table .sticky-col {
        position: sticky;
        z-index: 1;
        background: var(--bs-body-bg);
    }
    .model-summary-table thead .sticky-col {
        z-index: 3;
        background: var(--bs-tertiary-bg);
    }
    .model-summary-table .sticky-col-1 {
        left: 0;
        min-width: 120px;
    }
    .task-link {
        color: var(--bs-primary);
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
    }
    .task-link:hover {
        color: var(--bs-primary-text-emphasis);
        text-decoration: underline;
    }
    .time-stack {
        display: grid;
        gap: 0.15rem;
        line-height: 1.2;
    }
    .time-stack .date {
        font-weight: 650;
        color: var(--bs-body-color);
    }
    .time-stack .time {
        color: var(--bs-secondary-color);
        font-variant-numeric: tabular-nums;
    }
    .param-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        min-width: 240px;
        max-width: 420px;
        white-space: normal;
    }
    .param-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        max-width: 100%;
        padding: 0.18rem 0.45rem;
        border: 1px solid var(--bs-border-color);
        border-radius: 0.35rem;
        background: var(--bs-tertiary-bg);
        line-height: 1.2;
    }
    .param-tag .key {
        color: var(--bs-secondary-color);
    }
    .param-tag .value {
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 160px;
    }
    .metric-positive {
        color: #198754;
        font-weight: 700;
    }
    .metric-negative {
        color: #dc3545;
        font-weight: 700;
    }
</style>
            </main>
        </div>
    </div>

</body>
</html>

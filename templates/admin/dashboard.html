<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - Jaspil 任务管理系统</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">仪表盘</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="loadDashboard(true)">
            <i class="bi bi-arrow-clockwise"></i> 刷新
        </button>
    </div>
</div>

<div class="row g-3 mb-4" id="summary-cards">
    <div class="col-xl-2 col-md-4 col-6"><div class="card text-bg-primary h-100 border-0"><div class="card-body"><div class="small text-white-50">总任务数</div><div class="h4 mb-0" id="summary-total">0</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card text-bg-success h-100 border-0"><div class="card-body"><div class="small text-white-50">已完成</div><div class="h4 mb-0" id="summary-completed">0</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card text-bg-warning h-100 border-0"><div class="card-body"><div class="small text-dark-emphasis">运行中</div><div class="h4 mb-0" id="summary-running">0</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card text-bg-danger h-100 border-0"><div class="card-body"><div class="small text-white-50">错误</div><div class="h4 mb-0" id="summary-error">0</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card h-100"><div class="card-body"><div class="small text-muted">已取消</div><div class="h4 mb-0" id="summary-cancelled">0</div></div></div></div>
    <div class="col-xl-2 col-md-4 col-6"><div class="card h-100"><div class="card-body"><div class="small text-muted">待执行</div><div class="h4 mb-0" id="summary-pending">0</div></div></div></div>
</div>

<div class="row g-3 mb-4">
    <div class="col-lg-8">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-graph-up-arrow"></i> 最近 7 天任务趋势</span>
                <small class="text-muted" id="dashboard-last-update">-</small>
            </div>
            <div class="card-body">
                <canvas id="taskTrendChart" height="120"></canvas>
            </div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="card h-100">
            <div class="card-header"><i class="bi bi-pie-chart"></i> 状态分布</div>
            <div class="card-body">
                <canvas id="taskStatusChart" height="220"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-lg-5">
        <div class="card h-100">
            <div class="card-header"><i class="bi bi-bar-chart"></i> 任务类型分布</div>
            <div class="card-body">
                <canvas id="taskTypeChart" height="200"></canvas>
            </div>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="card h-100">
            <div class="card-header"><i class="bi bi-cpu"></i> 正在运行任务</div>
            <div class="card-body">
                <div id="active-task-list" class="row g-3"></div>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header"><i class="bi bi-clock-history"></i> 最近任务详情</div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>任务</th>
                        <th>状态</th>
                        <th>停止确认</th>
                        <th>参数组</th>
                        <th>进度</th>
                        <th>耗时</th>
                        <th>时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="recent-task-table"></tbody>
            </table>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
        <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/js/pages/admin_dashboard.js"></script>
</body>
</html>

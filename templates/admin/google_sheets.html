<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheet 管理</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/template-auth.css" rel="stylesheet">
    <link href="/static/css/common/theme.css" rel="stylesheet">
    <link href="/static/css/components/sidebar.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</head>
<body class="template-auth-pending">
    <div class="template-auth-loading" id="templateAuthLoading">
        <div class="template-auth-loading__card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="template-auth-loading__label" id="templateAuthLoadingLabel">正在恢复登录状态...</div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse" data-navbar></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 py-4 px-3 px-md-4 main-content" data-template-main-content>
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Google Sheet 管理</h2>
        <p class="text-muted mb-0">维护可选表格、启用状态和当前占用情况</p>
    </div>
    <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#sheetModal" onclick="openCreateModal()">
        <i class="bi bi-plus-circle me-1"></i> 新增表格
    </button>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">关键词</label>
                <input id="keyword" class="form-control" type="text" placeholder="名称 / Spreadsheet ID">
            </div>
            <div class="col-md-3">
                <label class="form-label">状态</label>
                <select id="activeFilter" class="form-select">
                    <option value="">全部</option>
                    <option value="1">启用</option>
                    <option value="0">停用</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">表类型</label>
                <select id="tableTypeFilter" class="form-select">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">占用情况</label>
                <select id="usageFilter" class="form-select">
                    <option value="">全部</option>
                    <option value="1">使用中</option>
                    <option value="0">空闲</option>
                </select>
            </div>
            <div class="col-md-1 d-grid">
                <button class="btn btn-outline-secondary" type="button" onclick="loadGoogleSheetsAdmin()">
                    <i class="bi bi-arrow-clockwise me-1"></i> 刷新
                </button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>Spreadsheet ID</th>
                        <th>表类型</th>
                        <th>备注</th>
                        <th>启用</th>
                        <th>是否使用中</th>
                        <th>当前任务</th>
                        <th class="text-end">操作</th>
                    </tr>
                </thead>
                <tbody id="sheetTableBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">正在加载...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="sheetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sheetModalTitle">新增表格</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="sheetRecordId">
                <div class="mb-3">
                    <label class="form-label">名称</label>
                    <input type="text" id="sheetName" class="form-control" placeholder="例如：主表-A">
                </div>
                <div class="mb-3">
                    <label class="form-label">Spreadsheet ID</label>
                    <input type="text" id="sheetSpreadsheetId" class="form-control" placeholder="请输入 Google Sheet ID 或完整 URL">
                    <div class="form-text">支持直接粘贴 Google Sheet URL，系统会自动提取 ID</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">表类型</label>
                    <select id="sheetTableType" class="form-select">
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">备注</label>
                    <textarea id="sheetRemark" class="form-control" rows="3" placeholder="可选"></textarea>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="sheetIsActive" checked>
                    <label class="form-check-label" for="sheetIsActive">启用</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" type="button" onclick="submitSheetForm()">保存</button>
            </div>
        </div>
    </div>
</div>
            </main>
        </div>
    </div>

    <script src="/static/js/template-auth.js?v=20260415_page_scope"></script>
    <script src="/static/js/common/components/navbar.js"></script>
    <script src="/static/js/common/admin-shell.js"></script>
    <script src="/static/js/trading-date.js"></script>
        <script src="/static/js/common/api.js"></script>
    <script src="/static/js/common/utils.js"></script>
<script src="/static/js/pages/admin_google_sheets.js"></script>
</body>
</html>
